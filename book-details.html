<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book Details — Novelora</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .book-details-page {
      min-height: 100vh;
    }

    .book-details-container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 40px 0 100px;
    }

    .book-back {
      display: inline-block;
      margin-bottom: 28px;
      text-decoration: none;
      font-weight: 700;
    }

    .book-hero {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      padding: 32px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .book-cover-large {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #f8d8ea 45%,
          #bd4e8d
        );

      color: #241522;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.25;

      box-shadow:
        0 20px 50px rgba(255, 105, 180, 0.20);
    }

    .book-label {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 800;
      opacity: 0.65;
      margin-bottom: 10px;
    }

    .book-title {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.05;
      margin: 0 0 12px;
    }

    .book-author {
      opacity: 0.75;
      margin-bottom: 20px;
    }

    .book-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 24px;
    }

    .book-meta span {
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255, 105, 180, 0.10);
      border: 1px solid rgba(255, 105, 180, 0.18);
      font-size: 13px;
      font-weight: 700;
    }

    .book-description {
      line-height: 1.8;
      opacity: 0.82;
      margin-bottom: 25px;
    }

    .book-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .book-action {
      border: none;
      cursor: pointer;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
    }

    .primary-action {
      background: linear-gradient(135deg, #ff69b4, #d94d93);
      color: white;
    }

    .secondary-action {
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .chapters-section {
      margin-top: 55px;
    }

    .section-small {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 800;
      opacity: 0.6;
      margin-bottom: 7px;
    }

    .chapters-section h2 {
      margin: 0 0 22px;
      font-size: 30px;
    }

    .chapter-list {
      display: grid;
      gap: 10px;
    }

    .chapter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      padding: 17px 20px;

      border-radius: 15px;

      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);

      text-decoration: none;
      color: inherit;

      transition: 0.2s ease;
    }

    .chapter-item:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 105, 180, 0.3);
      background: rgba(255, 105, 180, 0.06);
    }

    .chapter-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chapter-number {
      width: 42px;
      height: 42px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255, 105, 180, 0.12);
      font-weight: 900;
      flex-shrink: 0;
    }

    .chapter-title {
      font-weight: 800;
    }

    .chapter-subtitle {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 4px;
    }

    .chapter-price {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .free {
      color: #ff8bc5;
    }

    .paid {
      color: #ffd36b;
    }

    .empty-chapters {
      padding: 35px;
      text-align: center;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      opacity: 0.75;
    }

    @media (max-width: 750px) {

      .book-details-container {
        width: 94%;
        padding-top: 25px;
      }

      .book-hero {
        grid-template-columns: 1fr;
        padding: 22px;
      }

      .book-cover-large {
        width: min(220px, 75%);
        margin: 0 auto;
      }

      .book-title {
        font-size: 36px;
      }

      .book-actions {
        flex-direction: column;
      }

      .book-action {
        width: 100%;
        text-align: center;
        box-sizing: border-box;
      }

      .chapter-item {
        padding: 14px;
      }

    }

  </style>

</head>


<body class="reader-page book-details-page">


  <!-- TOP NAVIGATION -->

  <header class="reader-navbar">

    <a href="reader-dashboard.html" class="reader-logo">
      NOVEL<span>ORA</span>
    </a>

    <nav class="reader-nav">

      <a href="library.html">📚 Library</a>

      <a href="coins.html">🪙 Coins</a>

      <a href="trending.html">🔥 Trending</a>

      <a href="free-books.html">🆓 Free Books</a>

    </nav>

    <div class="reader-profile">

      <a href="notifications.html" class="notification-btn">
        🔔
      </a>

      <a href="profile.html" class="profile-btn">
        👤
      </a>

    </div>

  </header>



  <!-- BOOK CONTENT -->

  <main class="book-details-container">


    <a href="reader-dashboard.html" class="book-back">
      ← Back to Dashboard
    </a>


    <section class="book-hero">


      <!-- COVER -->

      <div
        id="bookCover"
        class="book-cover-large"
      >
        BOOK
      </div>



      <!-- INFORMATION -->

      <div>

        <div
          id="bookLabel"
          class="book-label"
        >
          NOVELORA STORY
        </div>


        <h1
          id="bookTitle"
          class="book-title"
        >
          Loading book...
        </h1>


        <p
          id="bookAuthor"
          class="book-author"
        >
        </p>


        <div
          id="bookMeta"
          class="book-meta"
        >
        </div>


        <p
          id="bookDescription"
          class="book-description"
        >
        </p>


        <div class="book-actions">

          <a
            id="startReading"
            href="#"
            class="book-action primary-action"
          >
            📖 Start Reading
          </a>


          <button
            type="button"
            class="book-action secondary-action"
            onclick="addCurrentBookToLibrary()"
          >
            ＋ Add to Library
          </button>

        </div>

      </div>

    </section>



    <!-- CHAPTERS -->

    <section class="chapters-section">

      <div class="section-small">
        THE STORY
      </div>

      <h2>
        Chapters
      </h2>


      <div
        id="chapterList"
        class="chapter-list"
      >
      </div>

    </section>


  </main>



  <!-- MOBILE NAVIGATION -->

  <nav class="mobile-reader-nav">

    <a href="reader-dashboard.html">
      🏠
      <span>Home</span>
    </a>

    <a href="library.html">
      📚
      <span>Library</span>
    </a>

    <a href="trending.html">
      🔥
      <span>Trending</span>
    </a>

    <a href="free-books.html">
      🆓
      <span>Free</span>
    </a>

    <a href="profile.html">
      👤
      <span>Profile</span>
    </a>

  </nav>



  <script>

    /*
      DEMO BOOK DATA

      These are temporary.
      Later this will come directly
      from the Novelora database/admin system.
    */

    const demoBooks = {

      "alpha-hybrid": {

        title: "The Alpha's Forbidden Hybrid",

        author: "Moonlight Writer",

        genre: "Romance",

        secondGenre: "Werewolf",

        rating: "16+",

        status: "Ongoing",

        description:
          "She was never supposed to exist. Born from a forbidden bloodline, she has spent her entire life hiding the secret that could destroy the supernatural world. But when the powerful Alpha King discovers what she really is, hiding becomes impossible.",

        coverText:
          "THE ALPHA'S<br>FORBIDDEN<br>HYBRID"

      },


      "billionaire-bride": {

        title: "The Billionaire's Secret Bride",

        author: "Novelora Writer",

        genre: "Billionaire",

        secondGenre: "Romance",

        rating: "16+",

        status: "Ongoing",

        description:
          "A secret marriage, a powerful billionaire and a love neither of them expected.",

        coverText:
          "THE<br>BILLIONAIRE'S<br>SECRET BRIDE"

      },


      "crown-of-the-moon": {

        title: "Crown of the Moon",

        author: "Moonlight Writer",

        genre: "Fantasy",

        secondGenre: "Romance",

        rating: "13+",

        status: "Ongoing",

        description:
          "A kingdom ruled by destiny, where a forgotten princess discovers that her bloodline may determine the fate of an entire realm.",

        coverText:
          "CROWN<br>OF THE<br>MOON"

      },


      "girl-behind-the-mask": {

        title: "The Girl Behind the Mask",

        author: "Novelora Writer",

        genre: "Mystery",

        secondGenre: "Drama",

        rating: "16+",

        status: "Ongoing",

        description:
          "Everyone has something to hide. But when one girl removes her mask, the truth could change everything.",

        coverText:
          "THE GIRL<br>BEHIND<br>THE MASK"

      }

    };



    /*
      GET BOOK ID FROM URL
    */

    const params =
      new URLSearchParams(window.location.search);

    const bookId =
      params.get("id") || "alpha-hybrid";


    const book =
      demoBooks[bookId];



    /*
      IF BOOK DOES NOT EXIST
    */

    if (!book) {

      document.getElementById("bookTitle").textContent =
        "Book Not Found";

      document.getElementById("bookDescription").textContent =
        "Sorry, this story could not be found.";

      document.getElementById("chapterList").innerHTML =

        '<div class="empty-chapters">Book not found.</div>';

    }


    else {


      /*
        PAGE TITLE
      */

      document.title =
        book.title + " — Novelora";


      /*
        BOOK INFORMATION
      */

      document.getElementById("bookTitle").textContent =
        book.title;


      document.getElementById("bookAuthor").innerHTML =
        "By <strong>" + book.author + "</strong>";


      document.getElementById("bookDescription").textContent =
        book.description;


      document.getElementById("bookCover").innerHTML =
        book.coverText;


      /*
        BOOK META
      */

      document.getElementById("bookMeta").innerHTML =

        "<span>❤️ " + book.genre + "</span>" +

        "<span>✨ " + book.secondGenre + "</span>" +

        "<span>🔞 " + book.rating + "</span>" +

        "<span>📖 " + book.status + "</span>";


      /*
        START READING
      */

      document.getElementById("startReading").href =

        "chapter.html?book=" +

        encodeURIComponent(bookId) +

        "&chapter=1";


      /*
        CHAPTERS

        Temporary demo chapters.
        We will replace these with
        real admin-published chapters.
      */

      const chapters = [

        {
          number: 1,
          title: "Chapter 1",
          description: "Begin the story",
          free: true
        },

        {
          number: 2,
          title: "Chapter 2",
          description: "Continue reading",
          free: false
        },

        {
          number: 3,
          title: "Chapter 3",
          description: "Continue reading",
          free: false
        },

        {
          number: 4,
          title: "Chapter 4",
          description: "Continue reading",
          free: false
        },

        {
          number: 5,
          title: "Chapter 5",
          description: "Continue reading",
          free: false
        }

      ];


      const chapterList =
        document.getElementById("chapterList");


      chapters.forEach(function(chapter) {


        const price =
          chapter.free
            ? '<span class="chapter-price free">FREE</span>'
            : '<span class="chapter-price paid">🪙 5</span>';


        const status =
          chapter.free
            ? "Start reading"
            : "Locked chapter";


        chapterList.innerHTML +=

          '<a href="chapter.html?book=' +

          encodeURIComponent(bookId) +

          '&chapter=' +

          chapter.number +

          '" class="chapter-item">' +

          '<div class="chapter-left">' +

          '<div class="chapter-number">' +

          chapter.number +

          '</div>' +

          '<div>' +

          '<div class="chapter-title">' +

          chapter.title +

          '</div>' +

          '<div class="chapter-subtitle">' +

          status +

          '</div>' +

          '</div>' +

          '</div>' +

          price +

          '</a>';

      });

    }



    /*
      ADD BOOK TO LIBRARY
    */

    function addCurrentBookToLibrary() {

      if (!book) {

        return;

      }


      let library =

        JSON.parse(
          localStorage.getItem("noveloraLibrary")
        ) || [];


      const exists =

        library.some(function(item) {

          return item.id === bookId;

        });


      if (exists) {

        alert(
          "This book is already in your library."
        );

        return;

      }


      library.push({

        id: bookId,

        title: book.title,

        author: book.author,

        genre: book.genre,

        cover: ""

      });


      localStorage.setItem(

        "noveloraLibrary",

        JSON.stringify(library)

      );


      alert(
        book.title +
        " has been added to your library!"
      );

    }

  </script>


</body>

</html>
