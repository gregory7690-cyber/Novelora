<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book Details — Novelora</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .book-details-page {
      min-height: 100vh;
    }

    .book-details-container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 40px 0 100px;
    }

    .book-back {
      display: inline-block;
      margin-bottom: 28px;
      text-decoration: none;
      font-weight: 700;
    }

    .book-hero {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      padding: 32px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .book-cover-large {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #f8d8ea 45%,
          #bd4e8d
        );

      color: #241522;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.25;

      box-shadow:
        0 20px 50px rgba(255, 105, 180, 0.20);
    }

    .book-label {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 800;
      opacity: 0.65;
      margin-bottom: 10px;
    }

    .book-title {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.05;
      margin: 0 0 12px;
    }

    .book-author {
      opacity: 0.75;
      margin-bottom: 20px;
    }

    .book-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 24px;
    }

    .book-meta span {
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255, 105, 180, 0.10);
      border: 1px solid rgba(255, 105, 180, 0.18);
      font-size: 13px;
      font-weight: 700;
    }

    .book-description {
      line-height: 1.8;
      opacity: 0.82;
      margin-bottom: 25px;
    }

    /* PROMOTION */

    .reader-promotion {
      display: none;
      margin: 0 0 25px;
      padding: 18px 20px;
      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 105, 180, 0.16),
          rgba(255, 211, 107, 0.08)
        );

      border: 1px solid rgba(255, 105, 180, 0.28);
      box-shadow: 0 12px 35px rgba(255, 105, 180, 0.08);
    }

    .promotion-top {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 900;
      color: #ff8bc5;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .promotion-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .promotion-description {
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.75;
      margin-bottom: 9px;
    }

    .promotion-price {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      font-size: 14px;
      font-weight: 800;
    }

    .promotion-old-price {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .promotion-new-price {
      color: #ffd36b;
      font-size: 18px;
    }

    .promotion-end {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.65;
    }

    .book-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .book-action {
      border: none;
      cursor: pointer;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
    }

    .primary-action {
      background: linear-gradient(135deg, #ff69b4, #d94d93);
      color: white;
    }

    .secondary-action {
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .chapters-section {
      margin-top: 55px;
    }

    .section-small {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 800;
      opacity: 0.6;
      margin-bottom: 7px;
    }

    .chapters-section h2 {
      margin: 0 0 22px;
      font-size: 30px;
    }

    .chapter-list {
      display: grid;
      gap: 10px;
    }

    .chapter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 17px 20px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      text-decoration: none;
      color: inherit;
      transition: 0.2s ease;
    }

    .chapter-item:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 105, 180, 0.3);
      background: rgba(255, 105, 180, 0.06);
    }

    .chapter-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chapter-number {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 105, 180, 0.12);
      font-weight: 900;
      flex-shrink: 0;
    }

    .chapter-title {
      font-weight: 800;
    }

    .chapter-subtitle {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 4px;
    }

    .chapter-price {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chapter-price-promo {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .chapter-old-price {
      text-decoration: line-through;
      opacity: 0.45;
      font-size: 12px;
    }

    .chapter-new-price {
      color: #ffd36b;
      font-size: 14px;
      font-weight: 900;
    }

    .free {
      color: #ff8bc5;
    }

    .paid {
      color: #ffd36b;
    }

    .empty-chapters {
      padding: 35px;
      text-align: center;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      opacity: 0.75;
    }

    @media (max-width: 750px) {
      .book-details-container {
        width: 94%;
        padding-top: 25px;
      }

      .book-hero {
        grid-template-columns: 1fr;
        padding: 22px;
      }

      .book-cover-large {
        width: min(220px, 75%);
        margin: 0 auto;
      }

      .book-title {
        font-size: 36px;
      }

      .book-actions {
        flex-direction: column;
      }

      .book-action {
        width: 100%;
        text-align: center;
        box-sizing: border-box;
      }

      .chapter-item {
        padding: 14px;
      }
    }
  </style>
</head>

<main class="book-details-container">

  </a>


  <section class="book-hero">

    <div
      id="bookCover"
      class="book-cover-large"

    </div>


    <div>

      <div
        id="bookLabel"
        class="book-label"

      </div>


      <h1
        id="bookTitle"

      </h1>


      <p

        id="bookMeta"

      <div

<script>

  /*
   * GET BOOK ID FROM URL
   */

  const params =
    new URLSearchParams(window.location.search);

  const bookId =
    params.get("id");


  /*
   * ADMIN BOOKS
   */

  const adminBooks =
    JSON.parse(
      localStorage.getItem("noveloraAdminBooks")
    ) || [];


  /*
   * FIND THE SELECTED BOOK
   */

  let book =
    adminBooks.find(function(item) {

      return String(
        item.id ||
        item.bookId ||
        item.bookID
      ) === String(bookId);

    });


  /*
   * DEMO BOOKS
   */

  const demoBooks = {

    "alpha-hybrid": {
      id: "alpha-hybrid",
      title: "The Alpha's Forbidden Hybrid",
      author: "Moonlight Writer",
      genre: "Romance",
      secondGenre: "Werewolf",
      rating: "16+",
      status: "Ongoing",
      description:
        "She was never supposed to exist. Born from a forbidden bloodline, she has spent her entire life hiding the secret that could destroy the supernatural world.",
      cover: ""
    },

    "billionaire-bride": {
      id: "billionaire-bride",
      title: "The Billionaire's Secret Bride",
      author: "Novelora Writer",
      genre: "Billionaire",
      secondGenre: "Romance",
      rating: "16+",
      status: "Ongoing",
      description:
        "A secret marriage, a powerful billionaire and a love neither of them expected.",
      cover: ""
    },

    "crown-of-the-moon": {
      id: "crown-of-the-moon",
      title: "Crown of the Moon",
      author: "Moonlight Writer",
      genre: "Fantasy",
      secondGenre: "Romance",
      rating: "13+",
      status: "Ongoing",
      description:
        "A kingdom ruled by destiny, where a forgotten princess discovers that her bloodline may determine the fate of an entire realm.",
      cover: ""
    },

    "girl-behind-the-mask": {
      id: "girl-behind-the-mask",
      title: "The Girl Behind the Mask",
      author: "Novelora Writer",
      genre: "Mystery",
      secondGenre: "Drama",
      rating: "16+",
      status: "Ongoing",
      description:
        "Everyone has something to hide. But when one girl removes her mask, the truth could change everything.",
      cover: ""
    }

  };


  if (!book) {

    book =
      demoBooks[bookId];

  }


  /*
   * BOOK NOT FOUND
   */

  if (!book) {

    document.getElementById(
      "bookTitle"
    ).textContent = "Book Not Found";


    document.getElementById(
      "bookDescription"
    ).textContent =
      "Sorry, this story could not be found.";


    document.getElementById(
      "chapterList"
    ).innerHTML =
      '<div class="empty-chapters">Book not found.</div>';

  }


  else {

    /*
     * NORMALIZE BOOK INFORMATION
     */

    const title =
      book.title ||
      book.bookTitle ||
      "Untitled Book";


    const author =
      book.author ||
      book.authorName ||
      book.penName ||
      "Unknown Author";


    const genre =
      book.genre ||
      "Romance";


    const secondGenre =
      book.subgenre ||
      book.secondaryGenre ||
      book.secondGenre ||
      "";


    const rating =
      book.ageRating ||
      book.rating ||
      "All Ages";


    const status =
      book.status ||
      book.storyStatus ||
      "Ongoing";


    const description =
      book.description ||
      book.synopsis ||
      "No description available.";


    const currentBookId =
      book.id ||
      book.bookId ||
      book.bookID ||
      bookId;


    /*
     * PAGE TITLE
     */

    document.title =
      title + " — Novelora";


    /*
     * BOOK INFORMATION
     */

    document.getElementById(
      "bookTitle"
    ).textContent =
      title;


    document.getElementById(
      "bookAuthor"
    ).innerHTML =
      "By <strong>" +
      author +
      "</strong>";


    document.getElementById(
      "bookDescription"
    ).textContent =
      description;


    /*
     * COVER
     */

    const cover =
      book.coverImage ||
      book.cover ||
      "";


    if (cover) {

      document.getElementById(
        "bookCover"
      ).style.backgroundImage =
        "url('" + cover + "')";

      document.getElementById(
        "bookCover"
      ).style.backgroundSize =
        "cover";

      document.getElementById(
        "bookCover"
      ).style.backgroundPosition =
        "center";

      document.getElementById(
        "bookCover"
      ).textContent = "";

    }

    else {

      document.getElementById(
        "bookCover"
      ).textContent =
        title.toUpperCase();

    }


    /*
     * META
     */

    let metaHTML =
      "<span>❤️ " +
      genre +
      "</span>";


    if (secondGenre) {

      metaHTML +=
        "<span>✨ " +
        secondGenre +
        "</span>";

    }


    metaHTML +=
      "<span>🔞 " +
      rating +
      "</span>" +
      "<span>📖 " +
      status +
      "</span>";


    document.getElementById(
      "bookMeta"
    ).innerHTML =
      metaHTML;


    /*
     * FIND ACTIVE PROMOTION
     */

    const promotions =
      JSON.parse(
        localStorage.getItem(
          "noveloraPromotions"
        )
      ) || [];


    const now =
      new Date();


    const activePromotion =
      promotions.find(function(promotion) {

        const promotionBookId =
          promotion.bookId ||
          promotion.bookID ||
          promotion.book;


        if (
          String(promotionBookId) !==
          String(currentBookId)
        ) {

          return false;

        }


        /*
         * Promotion dates
         */

        const start =
          promotion.startDate
            ? new Date(
                promotion.startDate +
                "T00:00:00"
              )
            : null;


        const end =
          promotion.endDate
            ? new Date(
                promotion.endDate +
                "T23:59:59"
              )
            : null;


        if (
          start &&
          now < start
        ) {

          return false;

        }


        if (
          end &&
          now > end
        ) {

          return false;

        }


        /*
         * If admin marked it
         * as ended, don't show it.
         */

        if (
          String(
            promotion.status ||
            ""
          ).toLowerCase() ===
          "ended"
        ) {

          return false;

        }


        /*
         * Only chapter discounts
         * affect chapter prices.
         */

        return String(
          promotion.type ||
          ""
        ).toLowerCase()
        .includes("discount");

      });


    /*
     * PROMOTION PRICE
     */

    let promotionPrice = null;


    if (activePromotion) {

      const discount =
        Number(
          activePromotion.discountCoins
        );


      if (
        Number.isFinite(discount) &&
        discount >= 0
      ) {

        promotionPrice =
          discount;

      }

    }


    /*
     * DISPLAY ACTIVE PROMOTION
     */

    if (
      activePromotion &&
      promotionPrice !== null
    ) {

      const promotionBox =
        document.getElementById(
          "readerPromotion"
        );


      const promotionTitle =
        activePromotion.title ||
        "Special Chapter Offer";


      const promotionDescription =
        activePromotion.description ||
        "Enjoy this limited-time chapter discount.";


      document.getElementById(
        "promotionTitle"
      ).textContent =
        promotionTitle;


      document.getElementById(
        "promotionDescription"
      ).textContent =
        promotionDescription;


      document.getElementById(
        "promotionPrice"
      ).innerHTML =

        '<span class="promotion-old-price">' +
          'Regular chapter price applies' +
        '</span>' +

        '<span class="promotion-new-price">' +
          '🪙 ' +
          promotionPrice +
          ' coins/chapter' +
        '</span>';


      if (activePromotion.endDate) {

        const endDate =
          new Date(
            activePromotion.endDate +
            "T23:59:59"
          );


        document.getElementById(
          "promotionEnd"
        ).textContent =
          "⏳ Offer ends " +
          endDate.toLocaleDateString(
            undefined,
            {
              year: "numeric",
              month: "long",
              day: "numeric"
            }
          );

      }


      promotionBox.style.display =
        "block";

    }


    /*
     * FIND ADMIN CHAPTERS
     */

    const adminChapters =
      JSON.parse(
        localStorage.getItem(
          "noveloraAdminChapters"
        )
      ) || [];


    const chapters =
      adminChapters

        .filter(function(chapter) {

          const chapterBookId =
            chapter.bookId ||
            chapter.bookID ||
            chapter.book;


          return String(
            chapterBookId
          ) === String(
            currentBookId
          );

        })

        .sort(function(a, b) {

          return Number(
            a.chapterNumber ||
            a.number ||
            0
          ) -

          Number(
            b.chapterNumber ||
            b.number ||
            0
          );

        });


    /*
     * CHAPTER LIST
     */

    const chapterList =
      document.getElementById(
        "chapterList"
      );


    chapterList.innerHTML = "";


    let publishedChapterCount = 0;


    if (chapters.length > 0) {


      chapters.forEach(function(chapter) {


        const number =
          chapter.chapterNumber ||
          chapter.number ||
          1;


        const chapterTitle =
          chapter.title ||
          chapter.chapterTitle ||
          "Chapter " + number;


        const access =
          String(
            chapter.access ||
            chapter.accessType ||
            "Paid"
          ).toLowerCase();


        const isFree =
          access === "free";


        const normalPrice =
          Number(
            chapter.price ||
            chapter.coinPrice ||
            5
          );


        const statusText =
          String(
            chapter.status ||
            "Published"
          ).toLowerCase();


        const isPublished =
          statusText === "published";


        /*
         * Do not show unpublished
         * chapters to readers.
         */

        if (!isPublished) {

          return;

        }


        publishedChapterCount++;


        /*
         * Apply active promotion
         */

        let readerPrice =
          normalPrice;


        let isDiscounted =
          false;


        if (
          !isFree &&
          promotionPrice !== null &&
          promotionPrice < normalPrice
        ) {

          readerPrice =
            promotionPrice;

          isDiscounted =
            true;

        }


        let priceHTML;


        if (isFree) {

          priceHTML =
            '<span class="chapter-price free">FREE</span>';

        }

        else if (isDiscounted) {

          priceHTML =

            '<span class="chapter-price paid chapter-price-promo">' +

              '<span class="chapter-old-price">' +
                '🪙 ' +
                normalPrice +
              '</span>' +

              '<span class="chapter-new-price">' +
                '🔥 🪙 ' +
                readerPrice +
              '</span>' +

            '</span>';

        }

        else {

          priceHTML =
            '<span class="chapter-price paid">🪙 ' +
              normalPrice +
            '</span>';

        }


        const subtitle =
          isFree
            ? "Free to read"

            : isDiscounted
              ? "🔥 Limited offer • " +
                readerPrice +
                " coins"

              : "Locked • " +
                normalPrice +
                " coins";


        const item =
          document.createElement("a");


        item.className =
          "chapter-item";


        item.href =
          "chapter.html?book=" +

          encodeURIComponent(
            currentBookId
          ) +

          "&chapter=" +

          encodeURIComponent(
            number
          );


        item.innerHTML =

          '<div class="chapter-left">' +

            '<div class="chapter-number">' +
              number +
            '</div>' +

            '<div>' +

              '<div class="chapter-title">' +
                chapterTitle +
              '</div>' +

              '<div class="chapter-subtitle">' +
                subtitle +
              '</div>' +

            '</div>' +

          '</div>' +

          priceHTML;


        chapterList.appendChild(
          item
        );

      });

    }


    /*
     * NO PUBLISHED CHAPTERS
     */

    if (publishedChapterCount === 0) {

      chapterList.innerHTML =

        '<div class="empty-chapters">' +

          '📖 No published chapters yet.<br><br>' +

          'Publish chapters from the Novelora Admin panel and they will appear here.' +

        '</div>';

    }


    /*
     * START READING
     */

    const firstPublished =
      chapters.find(function(chapter) {

        return String(
          chapter.status ||
          "Published"
        ).toLowerCase() ===
        "published";

      });


    if (firstPublished) {

      const firstNumber =
        firstPublished.chapterNumber ||
        firstPublished.number ||
        1;


      document.getElementById(
        "startReading"
      ).href =

        "chapter.html?book=" +

        encodeURIComponent(
          currentBookId
        ) +

        "&chapter=" +

        firstNumber;

    }

    else {

      document.getElementById(
        "startReading"
      ).style.display =
        "none";

    }

  }



  /*
   * ADD CURRENT BOOK TO LIBRARY
   */

  function addCurrentBookToLibrary() {

    if (!book) {

      return;

    }


    const bookID =
      book.id ||
      book.bookId ||
      book.bookID ||
      bookId;


    let library =
      JSON.parse(
        localStorage.getItem(
          "noveloraLibrary"
        )
      ) || [];


    const exists =
      library.some(function(item) {

        return String(
          item.id
        ) === String(
          bookID
        );

      });


    if (exists) {

      alert(
        "This book is already in your library."
      );

      return;

    }


    library.push({

      id: bookID,

      title:
        book.title ||
        book.bookTitle ||
        "Untitled Book",

      author:
        book.author ||
        book.authorName ||
        book.penName ||
        "Unknown Author",

      genre:
        book.genre ||
        "Romance",

      cover:
        book.coverImage ||
        book.cover ||
        ""

    });


    localStorage.setItem(
      "noveloraLibrary",
      JSON.stringify(library)
    );


    alert(
      (book.title ||
      book.bookTitle ||
      "This book") +

      " has been added to your library!"
    );

  }

</script>


</body>
</html>
