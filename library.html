<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Library — Novelora</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="reader-page">

  <!-- TOP NAVIGATION -->
  <header class="reader-navbar">

    <a href="reader-dashboard.html" class="reader-logo">
      NOVEL<span>ORA</span>
    </a>

    <nav class="reader-nav">

      <a href="library.html">
        📚 Library
      </a>

      <a href="coins.html">
        🪙 Coins
      </a>

      <a href="trending.html">
        🔥 Trending
      </a>

      <a href="free-books.html">
        🆓 Free Books
      </a>

    </nav>

    <div class="reader-profile">

      <button class="notification-btn" type="button">
        🔔
      </button>

      <button class="profile-btn" type="button">
        👤
      </button>

    </div>

  </header>


  <!-- LIBRARY -->
  <main class="reader-content">

    <section class="library-header">

      <div>
        <p class="section-label">
          YOUR STORIES
        </p>

        <h1>
          My Library
        </h1>

        <p>
          Save stories you love and keep them all in one place.
        </p>
      </div>

      <a href="reader-dashboard.html" class="add-books-button">
        ＋ Add Books
      </a>

    </section>


    <section class="library-section">

      <!-- EMPTY LIBRARY -->
      <div id="empty-library" class="empty-library">

        <div class="library-empty-icon">
          📚
        </div>

        <h2>
          Your library is empty
        </h2>

        <p>
          Explore Novelora and add stories you want to read later.
        </p>

        <a href="reader-dashboard.html" class="dashboard-button">
          Explore Books
        </a>

      </div>


      <!-- SAVED BOOKS -->
      <div
        id="library-books"
        class="library-books"
        style="display: none;"
      >
      </div>

    </section>

  </main>


  <!-- MOBILE NAVIGATION -->
  <nav class="mobile-reader-nav">

    <a href="reader-dashboard.html">
      🏠
      <span>Home</span>
    </a>

    <a href="library.html">
      📚
      <span>Library</span>
    </a>

    <a href="trending.html">
      🔥
      <span>Trending</span>
    </a>

    <a href="free-books.html">
      🆓
      <span>Free</span>
    </a>

    <a href="#">
      👤
      <span>Profile</span>
    </a>

  </nav>


  <script>

    function loadLibrary() {

      const savedBooks =
        JSON.parse(localStorage.getItem("noveloraLibrary")) || [];

      const libraryBooks =
        document.getElementById("library-books");

      const emptyLibrary =
        document.getElementById("empty-library");


      if (savedBooks.length === 0) {

        emptyLibrary.style.display = "block";
        libraryBooks.style.display = "none";

        return;

      }


      emptyLibrary.style.display = "none";
      libraryBooks.style.display = "grid";


      libraryBooks.innerHTML = "";


      savedBooks.forEach(function(book) {

        const bookCard = document.createElement("div");

        bookCard.className = "library-book-card";


        bookCard.innerHTML = `

          <div class="library-book-cover">

            ${
              book.cover
              ? `<img src="${book.cover}" alt="${book.title}">`
              : `<span>${book.genre || "BOOK"}</span>`
            }

          </div>

          <h3>
            ${book.title}
          </h3>

          <p>
            ${book.author || "Novelora Author"}
          </p>

          <button
            class="remove-library-button"
            onclick="removeFromLibrary('${book.id}')"
          >
            Remove
          </button>

        `;


        libraryBooks.appendChild(bookCard);

      });

    }


    function removeFromLibrary(bookId) {

      let savedBooks =
        JSON.parse(localStorage.getItem("noveloraLibrary")) || [];


      savedBooks =
        savedBooks.filter(function(book) {

          return book.id !== bookId;

        });


      localStorage.setItem(
        "noveloraLibrary",
        JSON.stringify(savedBooks)
      );


      loadLibrary();

    }


    loadLibrary();

  </script>

</body>
</html>
