<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account — Novelora</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <!-- LOGO -->
    <a href="index.html" class="auth-logo">
      Novelora
    </a>

    <p class="auth-tagline">
      Your next story awaits.
    </p>


    <!-- SIGN UP CARD -->
    <div class="auth-card">

      <h1>Create Account</h1>

      <p class="auth-subtitle">
        Join Novelora and start discovering your next favorite story.
      </p>


      <!-- GOOGLE SIGN UP -->
      <button class="google-login" type="button">
        <span class="google-icon">G</span>
        Continue with Google
      </button>


      <div class="auth-divider">
        <span>OR</span>
      </div>


      <!-- USERNAME -->
      <label for="signup-username">
        Username
      </label>

      <input
        type="text"
        id="signup-username"
        placeholder="Enter your username"
      >


      <!-- EMAIL -->
      <label for="signup-email">
        Email
      </label>

      <input
        type="email"
        id="signup-email"
        placeholder="Enter your email"
      >


      <!-- PASSWORD -->
      <label for="signup-password">
        Password
      </label>

      <input
        type="password"
        id="signup-password"
        placeholder="Create a password"
      >


      <!-- CONFIRM PASSWORD -->
      <label for="signup-confirm-password">
        Confirm Password
      </label>

      <input
        type="password"
        id="signup-confirm-password"
        placeholder="Confirm your password"
      >


      <!-- CREATE ACCOUNT -->
      <button class="auth-button" type="button">
        Create Account
      </button>


      <!-- LOGIN -->
      <p class="auth-switch">
        Already have an account?
        <a href="login.html">
          Log In
        </a>
      </p>

    </div>


    <!-- BACK HOME -->
    <a href="index.html" class="back-home">
      ← Back to Novelora
    </a>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const createAccountButton = document.querySelector(".auth-button");

createAccountButton.addEventListener("click", async function () {
  const username = document.getElementById("signup-username").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;
  const confirmPassword = document.getElementById("signup-confirm-password").value;

  if (!username || !email || !password || !confirmPassword) {
    alert("Please fill in all fields.");
    return;
  }

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
  }

  createAccountButton.disabled = true;
  createAccountButton.textContent = "Creating Account...";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        username: username
      }
    }
  });

  if (error) {
    alert(error.message);
    createAccountButton.disabled = false;
    createAccountButton.textContent = "Create Account";
    return;
  }

  if (data.user) {
    alert("Account created successfully! Please check your email to verify your account.");
    window.location.href = "login.html";
  }
});
</script>

</body>
</html>
