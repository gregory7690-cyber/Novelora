<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - Novelora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fa;
      color: #171717;
    }

    .edit-page {
      max-width: 600px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    .back-btn {
      display: inline-block;
      text-decoration: none;
      color: #d81b60;
      font-weight: 700;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 30px;
      font-size: 28px;
    }

    .edit-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
    }

    .picture-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .profile-preview {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 15px;
      background: #f8d7e5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 45px;
      font-weight: bold;
      color: #d81b60;
    }

    .profile-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .change-picture {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #e91e63;
      border-radius: 10px;
      color: #e91e63;
      font-weight: 700;
      cursor: pointer;
    }

    #profilePicture {
      display: none;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #e91e63;
    }

    .save-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #e91e63;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .save-btn:hover {
      background: #d81b60;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: 700;
      color: #2e7d32;
      display: none;
    }

    @media (max-width: 600px) {
      .edit-page {
        padding: 20px 15px 40px;
      }

      .edit-card {
        padding: 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="edit-page">

    <a href="profile.html" class="back-btn">← Back to Profile</a>

    <h1>Edit Profile</h1>

    <section class="edit-card">

      <!-- PROFILE PICTURE -->
      <div class="picture-section">

        <div class="profile-preview" id="profilePreview">
          👤
        </div>

        <label for="profilePicture" class="change-picture">
          🖼️ Change Picture
        </label>

        <input
          type="file"
          id="profilePicture"
          accept="image/*"
        >

      </div>

      <!-- NAME -->
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your name"
        >
      </div>

      <!-- USERNAME -->
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="@username"
        >
      </div>

      <!-- SAVE -->
      <button class="save-btn" id="saveBtn">
        Save Changes
      </button>

      <div class="message" id="message">
        Profile updated successfully! 💕
      </div>

    </section>

  </main>

  <script>
    const nameInput = document.getElementById("name");
    const usernameInput = document.getElementById("username");
    const profilePicture = document.getElementById("profilePicture");
    const profilePreview = document.getElementById("profilePreview");
    const saveBtn = document.getElementById("saveBtn");
    const message = document.getElementById("message");

    // Load saved profile information
    const savedName = localStorage.getItem("noveloraName");
    const savedUsername = localStorage.getItem("noveloraUsername");
    const savedPicture = localStorage.getItem("noveloraProfilePicture");

    if (savedName) {
      nameInput.value = savedName;
    }

    if (savedUsername) {
      usernameInput.value = savedUsername;
    }

    if (savedPicture) {
      profilePreview.innerHTML = `<img src="${savedPicture}" alt="Profile picture">`;
    }

    // Preview new picture
    profilePicture.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {
        profilePreview.innerHTML = `
          <img src="${event.target.result}" alt="Profile picture">
        `;
      };

      reader.readAsDataURL(file);
    });

    // Save profile
    saveBtn.addEventListener("click", function () {

      const name = nameInput.value.trim();
      const username = usernameInput.value.trim();

      if (!name || !username) {
        alert("Please enter your name and username.");
        return;
      }

      localStorage.setItem("noveloraName", name);
      localStorage.setItem("noveloraUsername", username);

      const file = profilePicture.files[0];

      if (file) {
        const reader = new FileReader();

        reader.onload = function (event) {
          localStorage.setItem(
            "noveloraProfilePicture",
            event.target.result
          );

          showSuccess();
        };

        reader.readAsDataURL(file);

      } else {
        showSuccess();
      }
    });

    function showSuccess() {
      message.style.display = "block";

      setTimeout(function () {
        window.location.href = "profile.html";
      }, 1000);
    }
  </script>

</body>
  </html>
