<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — Novelora</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <!-- LOGO -->
    <a href="index.html" class="auth-logo">
      Novelora
    </a>

    <p class="auth-tagline">Your next story awaits.</p>


    <!-- LOGIN CARD -->
    <div class="auth-card">

      <h1>Welcome Back</h1>

      <p class="auth-subtitle">
        Log in to continue reading your favorite stories.
      </p>


      <!-- GOOGLE LOGIN -->
      <button class="google-login" type="button">
        <span class="google-icon">G</span>
        Continue with Google
      </button>


      <div class="auth-divider">
        <span>OR</span>
      </div>


      <!-- EMAIL / PHONE -->
      <label for="login-email">Email or phone number</label>

      <input
        type="text"
        id="login-email"
        placeholder="Enter your email or phone number"
      >


      <!-- SEND CODE -->
      <button class="auth-button" type="button">
        Send verification code
      </button>


      <p class="auth-note">
        We'll send you a verification code to securely log you in.
      </p>


      <!-- SIGN UP -->
      <p class="auth-switch">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

    </div>


    <!-- BACK HOME -->
    <a href="index.html" class="back-home">
      ← Back to Novelora
    </a>

  </div>

</body>
</html>
