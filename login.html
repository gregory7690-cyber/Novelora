<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Novelora</title><link rel="stylesheet" href="style.css"><style>
.password-wrapper {
  position: relative;
  width: 100%;
}

.password-wrapper input {
  width: 100%;
  padding-right: 48px;
  box-sizing: border-box;
}

.password-toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #aaa;
  cursor: pointer;
  font-size: 18px;
  padding: 4px;
  line-height: 1;
}

.password-toggle:hover {
  color: #ff69b4;
}

.auth-button:disabled {
  opacity: 0.7;
  cursor: wait;
}
</style></head><body class="auth-page"><div class="auth-container">  <!-- LOGO -->  <a href="index.html" class="auth-logo">
    Novelora
  </a>  <p class="auth-tagline">
    Your next story awaits.
  </p>  <!-- LOGIN CARD -->  <div class="auth-card"><h1>Welcome Back</h1>

<p class="auth-subtitle">
  Log in to continue reading your favorite stories.
</p>


<!-- GOOGLE LOGIN -->
<button class="google-login" type="button">
  <span class="google-icon">G</span>
  Continue with Google
</button>


<div class="auth-divider">
  <span>OR</span>
</div>


<!-- EMAIL -->
<label for="login-email">
  Email
</label>

<input
  type="email"
  id="login-email"
  placeholder="Enter your email"
  autocomplete="email"
>


<!-- PASSWORD -->
<label for="login-password">
  Password
</label>

<div class="password-wrapper">

  <input
    type="password"
    id="login-password"
    placeholder="Enter your password"
    autocomplete="current-password"
  >

  <button
    type="button"
    class="password-toggle"
    id="password-toggle"
    aria-label="Show password"
  >
    👁
  </button>

</div>


<!-- FORGOT PASSWORD -->
<div class="forgot-password">
  <a href="forgot-password.html">
    Forgot password?
  </a>
</div>


<!-- LOGIN BUTTON -->
<button class="auth-button" type="button" id="login-button">
  Log In
</button>


<!-- CREATE ACCOUNT -->
<p class="auth-switch">
  Don't have an account?
  <a href="signup.html">
    Create Account
  </a>
</p>

  </div>  <!-- BACK HOME -->  <a href="index.html" class="back-home">
    ← Back to Novelora
  </a></div><!-- SUPABASE --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
/* ================================
   SHOW / HIDE PASSWORD
================================ */

const passwordInput = document.getElementById("login-password");
const passwordToggle = document.getElementById("password-toggle");

passwordToggle.addEventListener("click", function () {

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    passwordToggle.textContent = "🙈";
    passwordToggle.setAttribute("aria-label", "Hide password");
  } else {
    passwordInput.type = "password";
    passwordToggle.textContent = "👁";
    passwordToggle.setAttribute("aria-label", "Show password");
  }

});


/* ================================
   SUPABASE LOGIN
================================ */

const loginButton = document.getElementById("login-button");
const emailInput = document.getElementById("login-email");

loginButton.addEventListener("click", async function () {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    alert("Please enter your email and password.");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Logging in...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {

    alert(error.message);

    loginButton.disabled = false;
    loginButton.textContent = "Log In";

    return;
  }


  if (data.user) {

    window.location.href = "reader-dashboard.html";

  }

});
</script></body>
</html>
