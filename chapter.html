<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter | Novelora</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .chapter-page {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(255, 105, 180, 0.12), transparent 35%),
        radial-gradient(circle at bottom left, rgba(255, 20, 147, 0.08), transparent 35%);
      padding-bottom: 80px;
    }

    .chapter-wrap {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding-top: 28px;
    }

    .chapter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .back-btn,
    .coin-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .back-btn {
      background: rgba(255,255,255,0.07);
      color: inherit;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .coin-btn {
      background: linear-gradient(135deg, #ff4f9a, #ff76b5);
      color: white;
      border: none;
      box-shadow: 0 8px 25px rgba(255, 79, 154, 0.2);
    }

    .back-btn:hover,
    .coin-btn:hover {
      transform: translateY(-2px);
    }

    .chapter-heading {
      text-align: center;
      margin: 20px auto 35px;
    }

    .chapter-book {
      color: #ff72ad;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .chapter-heading h1 {
      font-size: clamp(28px, 5vw, 44px);
      margin: 0 0 10px;
      line-height: 1.15;
    }

    .chapter-heading p {
      margin: 0;
      opacity: 0.65;
    }

    .chapter-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 15px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 105, 180, 0.1);
      color: #ff72ad;
      font-size: 13px;
      font-weight: 700;
    }

    .chapter-card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .chapter-content {
      padding: clamp(22px, 5vw, 50px);
      font-size: 18px;
      line-height: 2;
    }

    .chapter-content p {
      margin: 0 0 1.5em;
    }

    .chapter-content h2,
    .chapter-content h3 {
      line-height: 1.3;
      margin-top: 1.8em;
    }

    .chapter-content img {
      max-width: 100%;
      border-radius: 14px;
    }

    .chapter-lock {
      padding: 55px 25px;
      text-align: center;
    }

    .lock-icon {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      background: rgba(255, 105, 180, 0.12);
      font-size: 36px;
    }

    .chapter-lock h2 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .chapter-lock p {
      max-width: 500px;
      margin: 0 auto 22px;
      opacity: 0.7;
      line-height: 1.6;
    }

    .unlock-price {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 105, 180, 0.1);
      color: #ff72ad;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .promo-old-price {
      text-decoration: line-through;
      opacity: 0.5;
      margin-right: 4px;
    }

    .promo-price {
      color: #ff72ad;
      font-weight: 900;
    }

    .promo-badge {
      display: block;
      width: fit-content;
      margin: 0 auto 15px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 70, 150, 0.12);
      border: 1px solid rgba(255, 105, 180, 0.18);
      color: #ff72ad;
      font-size: 13px;
      font-weight: 800;
    }

    .promo-expiry {
      margin: -10px auto 20px;
      font-size: 12px;
      opacity: 0.55;
    }

    .unlock-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      cursor: pointer;
      padding: 14px 26px;
      border-radius: 13px;
      background: linear-gradient(135deg, #ff3f92, #ff78b8);
      color: white;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(255, 63, 146, 0.25);
      transition: 0.2s ease;
    }

    .unlock-btn:hover {
      transform: translateY(-2px);
    }

    .unlock-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .coin-balance {
      margin-top: 15px;
      font-size: 14px;
      opacity: 0.7;
    }

    .chapter-message {
      margin: 20px auto 0;
      max-width: 520px;
      padding: 13px 16px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .chapter-message.error {
      display: block;
      background: rgba(255, 70, 70, 0.1);
      border: 1px solid rgba(255, 70, 70, 0.18);
      color: #ff9b9b;
    }

    .chapter-message.success {
      display: block;
      background: rgba(60, 220, 140, 0.1);
      border: 1px solid rgba(60, 220, 140, 0.18);
      color: #8ff0b8;
    }

    .chapter-nav {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 25px;
    }

    .chapter-nav a {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.045);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .chapter-nav a:hover {
      background: rgba(255,105,180,0.1);
    }

    .chapter-nav .next {
      text-align: right;
    }

    .nav-label {
      display: block;
      font-size: 12px;
      opacity: 0.55;
      margin-bottom: 4px;
    }

    .nav-title {
      display: block;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chapter-footer {
      text-align: center;
      margin-top: 35px;
      opacity: 0.5;
      font-size: 13px;
    }

    .loading-state,
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .chapter-wrap {
        width: min(100% - 20px, 900px);
        padding-top: 15px;
      }

      .chapter-content {
        padding: 24px 19px;
        font-size: 17px;
        line-height: 1.9;
      }

      .chapter-top {
        margin-bottom: 15px;
      }

      .chapter-heading {
        margin-bottom: 25px;
      }

      .chapter-nav {
        flex-direction: column;
      }

      .chapter-nav .next {
        text-align: left;
      }
    }
  </style>
</head>

<body class="reader-page chapter-page">

<main class="chapter-wrap">

  <div class="chapter-top">
    <a href="#" id="backToBook" class="back-btn">
      ← Back to Book
    </a>

    <a href="coins.html" class="coin-btn">
      🪙 <span id="topCoins">0</span> Coins
    </a>
  </div>

  <div id="loadingState" class="loading-state">
    Loading chapter...
  </div>

  <div id="chapterArea" style="display:none;">

    <header class="chapter-heading">
      <div id="bookTitle" class="chapter-book"></div>

      <h1 id="chapterTitle"></h1>

      <p id="chapterMeta"></p>

      <div id="chapterStatus" class="chapter-status"></div>
    </header>

    <section class="chapter-card">

      <div id="lockScreen" class="chapter-lock" style="display:none;">

        <div class="lock-icon">🔒</div>

        <h2>This Chapter Is Locked</h2>

        <p>
          Unlock this chapter with coins to continue reading.
        </p>

        <div id="promotionBadge" class="promo-badge" style="display:none;">
          🔥 Limited-Time Offer
        </div>

        <div class="unlock-price" id="unlockPriceBox">
          🪙 <span id="unlockPrice">5</span> Coins
        </div>

        <div id="promotionExpiry" class="promo-expiry" style="display:none;"></div>

        <br>

        <button id="unlockButton" class="unlock-btn">
          🔓 Unlock Chapter
        </button>

        <div id="coinBalance" class="coin-balance">
          You have 0 coins
        </div>

        <div id="unlockMessage" class="chapter-message"></div>

      </div>

      <article id="chapterContent"
               class="chapter-content"
               style="display:none;"></article>

    </section>

    <div id="chapterNavigation" class="chapter-nav"></div>

    <div class="chapter-footer">
      You're reading on Novelora · Your next story awaits.
    </div>

  </div>

</main>

<script>
(function () {

  "use strict";

  /* =========================================================
     URL
  ========================================================= */

  const params = new URLSearchParams(window.location.search);

  const bookId = params.get("book");
  const chapterNumber = params.get("chapter");


  /* =========================================================
     DOM
  ========================================================= */

  const loadingState = document.getElementById("loadingState");
  const chapterArea = document.getElementById("chapterArea");

  const bookTitleEl = document.getElementById("bookTitle");
  const chapterTitleEl = document.getElementById("chapterTitle");
  const chapterMetaEl = document.getElementById("chapterMeta");
  const chapterStatusEl = document.getElementById("chapterStatus");

  const lockScreen = document.getElementById("lockScreen");
  const chapterContent = document.getElementById("chapterContent");

  const unlockPriceEl = document.getElementById("unlockPrice");
  const unlockPriceBox = document.getElementById("unlockPriceBox");
  const unlockButton = document.getElementById("unlockButton");

  const coinBalanceEl = document.getElementById("coinBalance");
  const unlockMessage = document.getElementById("unlockMessage");

  const promotionBadge = document.getElementById("promotionBadge");
  const promotionExpiry = document.getElementById("promotionExpiry");

  const topCoins = document.getElementById("topCoins");

  const backToBook = document.getElementById("backToBook");
  const chapterNavigation = document.getElementById("chapterNavigation");


  /* =========================================================
     STORAGE
  ========================================================= */

  function getJSON(key, fallback) {

    try {

      const value = localStorage.getItem(key);

      if (!value) {
        return fallback;
      }

      return JSON.parse(value);

    } catch (error) {

      console.error("Novelora storage error:", key, error);

      return fallback;
    }
  }


  function saveJSON(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }


  /* =========================================================
     ADMIN DATA
  ========================================================= */

  const adminBooks =
    getJSON("noveloraAdminBooks", []);

  const adminChapters =
    getJSON("noveloraAdminChapters", []);

  const promotions =
    getJSON("noveloraPromotions", []);


  /* =========================================================
     FIND BOOK
  ========================================================= */

  function findBook() {

    return adminBooks.find(function (book) {

      const id =
        book.id ||
        book.bookId ||
        book.bookID;

      return String(id) === String(bookId);

    });

  }


  /* =========================================================
     FIND CHAPTER
  ========================================================= */

  function findChapter() {

    return adminChapters.find(function (chapter) {

      const chapterBook =
        chapter.bookId ||
        chapter.bookID ||
        chapter.book;

      const number =
        chapter.chapterNumber ||
        chapter.number ||
        chapter.chapter;

      return (
        String(chapterBook) === String(bookId) &&
        String(number) === String(chapterNumber)
      );

    });

  }


  /* =========================================================
     ACTIVE PROMOTION
  ========================================================= */

  function getActivePromotion() {

    if (!Array.isArray(promotions)) {
      return null;
    }

    const now = new Date();

    const matching = promotions.filter(function (promotion) {

      if (!promotion) {
        return false;
      }

      const promotionBook =
        promotion.bookId ||
        promotion.bookID ||
        promotion.book;

      if (
        String(promotionBook) !== String(bookId)
      ) {
        return false;
      }

      const type =
        String(promotion.type || "").toLowerCase();

      if (!type.includes("discount")) {
        return false;
      }

      const discountCoins =
        Number(promotion.discountCoins);

      if (
        !Number.isFinite(discountCoins) ||
        discountCoins < 0
      ) {
        return false;
      }

      const start =
        promotion.startDate
          ? new Date(promotion.startDate)
          : null;

      const end =
        promotion.endDate
          ? new Date(promotion.endDate)
          : null;

      if (
        start &&
        !isNaN(start.getTime()) &&
        now < start
      ) {
        return false;
      }

      if (
        end &&
        !isNaN(end.getTime()) &&
        now > end
      ) {
        return false;
      }

      return true;

    });

    if (!matching.length) {
      return null;
    }

    /*
     * If multiple discounts exist, use the lowest valid
     * promotional price.
     */

    matching.sort(function (a, b) {

      return (
        Number(a.discountCoins) -
        Number(b.discountCoins)
      );

    });

    return matching[0];

  }


  /* =========================================================
     GET NORMAL CHAPTER PRICE
  ========================================================= */

  function getNormalPrice(chapter) {

    const possiblePrices = [

      chapter.coinPrice,

      chapter.price,

      chapter.chapterPrice,

      chapter.coins,

      chapter.unlockPrice

    ];

    for (let i = 0; i < possiblePrices.length; i++) {

      const value =
        Number(possiblePrices[i]);

      if (
        Number.isFinite(value) &&
        value >= 0
      ) {

        return value;
      }

    }

    /*
     * Novelora default chapter price.
     */

    return 5;
  }


  /* =========================================================
     GET EFFECTIVE PRICE
  ========================================================= */

  function getEffectivePrice(chapter) {

    const normalPrice =
      getNormalPrice(chapter);

    const promotion =
      getActivePromotion();

    if (!promotion) {

      return {
        normalPrice: normalPrice,
        effectivePrice: normalPrice,
        promotion: null
      };

    }

    const promotionalPrice =
      Number(promotion.discountCoins);

    /*
     * Never allow a promotion to make the chapter
     * more expensive than the normal price.
     */

    if (
      !Number.isFinite(promotionalPrice) ||
      promotionalPrice < 0 ||
      promotionalPrice >= normalPrice
    ) {

      return {
        normalPrice: normalPrice,
        effectivePrice: normalPrice,
        promotion: null
      };

    }

    return {
      normalPrice: normalPrice,
      effectivePrice: promotionalPrice,
      promotion: promotion
    };

  }


  /* =========================================================
     READER
  ========================================================= */

  function getReader() {

    let reader =
      getJSON("noveloraCurrentReader", null);

    if (reader) {
      return reader;
    }

    reader =
      getJSON("noveloraReader", null);

    if (reader) {
      return reader;
    }

    const readers =
      getJSON("noveloraReaders", []);

    if (
      Array.isArray(readers) &&
      readers.length
    ) {

      return readers[0];

    }

    reader = {

      id: "reader_demo",

      username: "Reader",

      email: "",

      coins: 20,

      createdAt:
        new Date().toISOString()

    };

    saveJSON(
      "noveloraCurrentReader",
      reader
    );

    return reader;

  }


  /* =========================================================
     COINS
  ========================================================= */

  function getCoins(reader) {

    const possibleCoins = [

      reader.coins,

      reader.coinBalance,

      reader.balance,

      reader.coinsBalance

    ];

    for (
      let i = 0;
      i < possibleCoins.length;
      i++
    ) {

      if (
        possibleCoins[i] !== undefined &&
        possibleCoins[i] !== null &&
        !isNaN(Number(possibleCoins[i]))
      ) {

        return Number(possibleCoins[i]);

      }

    }

    return 0;

  }


  function saveReaderCoins(reader, coins) {

    coins =
      Math.max(
        0,
        Number(coins) || 0
      );

    reader.coins = coins;
    reader.coinBalance = coins;

    saveJSON(
      "noveloraCurrentReader",
      reader
    );


    const readers =
      getJSON("noveloraReaders", []);

    if (
      Array.isArray(readers) &&
      readers.length
    ) {

      const readerId =
        reader.id ||
        reader.readerId ||
        reader.userId;

      const readerEmail =
        reader.email || "";


      const index =
        readers.findIndex(function (item) {

          const itemId =
            item.id ||
            item.readerId ||
            item.userId;

          return (

            (
              readerId &&
              String(itemId) ===
              String(readerId)
            )

            ||

            (
              readerEmail &&
              item.email &&
              String(item.email).toLowerCase() ===
              String(readerEmail).toLowerCase()
            )

          );

        });


      if (index !== -1) {

        readers[index].coins =
          coins;

        readers[index].coinBalance =
          coins;

        saveJSON(
          "noveloraReaders",
          readers
        );

      }

    }


    updateCoinDisplays(reader);

  }


  function updateCoinDisplays(reader) {

    const coins =
      getCoins(reader);

    topCoins.textContent =
      coins;

    coinBalanceEl.textContent =
      "You have " +
      coins +
      " coin" +
      (coins === 1 ? "" : "s");

  }


  /* =========================================================
     UNLOCK STORAGE
  ========================================================= */

  function getUnlocks() {

    const unlocks =
      getJSON(
        "noveloraChapterUnlocks",
        []
      );

    return Array.isArray(unlocks)
      ? unlocks
      : [];

  }


  function getReaderId(reader) {

    return (

      reader.id ||

      reader.readerId ||

      reader.userId ||

      reader.email ||

      "reader_demo"

    );

  }


  function isChapterUnlocked(reader) {

    const unlocks =
      getUnlocks();

    const readerId =
      getReaderId(reader);


    return unlocks.some(function (unlock) {

      const unlockReader =
        unlock.readerId ||
        unlock.userId ||
        unlock.readerEmail ||
        unlock.reader;

      const unlockBook =
        unlock.bookId ||
        unlock.bookID ||
        unlock.book;

      const unlockChapter =
        unlock.chapterNumber ||
        unlock.chapter ||
        unlock.number;


      return (

        String(unlockReader) ===
        String(readerId)

        &&

        String(unlockBook) ===
        String(bookId)

        &&

        String(unlockChapter) ===
        String(chapterNumber)

      );

    });

  }


  /* =========================================================
     RECORD UNLOCK
  ========================================================= */

  function recordUnlock(
    reader,
    chapter,
    price,
    promotion
  ) {

    const unlocks =
      getUnlocks();

    const readerId =
      getReaderId(reader);


    const alreadyUnlocked =
      unlocks.some(function (unlock) {

        const unlockReader =
          unlock.readerId ||
          unlock.userId ||
          unlock.readerEmail ||
          unlock.reader;

        const unlockBook =
          unlock.bookId ||
          unlock.bookID ||
          unlock.book;

        const unlockChapter =
          unlock.chapterNumber ||
          unlock.chapter ||
          unlock.number;


        return (

          String(unlockReader) ===
          String(readerId)

          &&

          String(unlockBook) ===
          String(bookId)

          &&

          String(unlockChapter) ===
          String(chapterNumber)

        );

      });


    if (alreadyUnlocked) {
      return;
    }


    const bookTitle =
      currentBook
        ? (
            currentBook.title ||
            currentBook.bookTitle ||
            "Untitled Book"
          )
        : "Untitled Book";


    const chapterTitle =
      chapter.title ||
      chapter.chapterTitle ||
      ("Chapter " + chapterNumber);


    unlocks.push({

      id:
        "unlock_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2, 8),

      readerId:
        readerId,

      readerEmail:
        reader.email || "",

      bookId:
        bookId,

      bookTitle:
        bookTitle,

      chapterNumber:
        Number(chapterNumber),

      chapterTitle:
        chapterTitle,

      coinsSpent:
        price,

      price:
        price,

      originalPrice:
        promotion
          ? getNormalPrice(chapter)
          : price,

      discountApplied:
        !!promotion,

      promotionId:
        promotion
          ? promotion.id || null
          : null,

      promotionTitle:
        promotion
          ? promotion.title || ""
          : "",

      unlockedAt:
        new Date().toISOString()

    });


    saveJSON(
      "noveloraChapterUnlocks",
      unlocks
    );

  }


  /* =========================================================
     RECORD TRANSACTION
  ========================================================= */

  function recordTransaction(
    reader,
    chapter,
    price,
    promotion
  ) {

    const transactions =
      getJSON(
        "noveloraTransactions",
        []
      );


    const readerId =
      getReaderId(reader);


    const bookTitle =
      currentBook
        ? (
            currentBook.title ||
            currentBook.bookTitle ||
            "Untitled Book"
          )
        : "Untitled Book";


    const chapterTitle =
      chapter.title ||
      chapter.chapterTitle ||
      ("Chapter " + chapterNumber);


    transactions.push({

      id:
        "tx_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2, 8),

      type:
        "chapter_unlock",

      status:
        "completed",

      readerId:
        readerId,

      readerEmail:
        reader.email || "",

      bookId:
        bookId,

      bookTitle:
        bookTitle,

      chapterNumber:
        Number(chapterNumber),

      chapterTitle:
        chapterTitle,

      coinsSpent:
        price,

      originalPrice:
        promotion
          ? getNormalPrice(chapter)
          : price,

      discountApplied:
        !!promotion,

      promotionId:
        promotion
          ? promotion.id || null
          : null,

      promotionTitle:
        promotion
          ? promotion.title || ""
          : "",

      /*
       * Coin spending is not direct cash revenue.
       */

      amount:
        0,

      currency:
        "USD",

      date:
        new Date().toISOString(),

      createdAt:
        new Date().toISOString()

    });


    saveJSON(
      "noveloraTransactions",
      transactions
    );

  }


  /* =========================================================
     ADMIN ACTIVITY
  ========================================================= */

  function recordActivity(
    reader,
    chapter,
    price,
    promotion
  ) {

    const activities =
      getJSON(
        "noveloraAdminActivities",
        []
      );


    const bookTitle =
      currentBook
        ? (
            currentBook.title ||
            currentBook.bookTitle ||
            "Untitled Book"
          )
        : "Untitled Book";


    const chapterTitle =
      chapter.title ||
      chapter.chapterTitle ||
      ("Chapter " + chapterNumber);


    activities.push({

      id:
        "activity_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2, 8),

      type:
        "chapter_unlock",

      action:
        "Reader unlocked a chapter",

      readerId:
        getReaderId(reader),

      reader:
        reader.username ||
        reader.name ||
        "Reader",

      bookId:
        bookId,

      bookTitle:
        bookTitle,

      chapterNumber:
        Number(chapterNumber),

      chapterTitle:
        chapterTitle,

      coinsSpent:
        price,

      promotionId:
        promotion
          ? promotion.id || null
          : null,

      promotionTitle:
        promotion
          ? promotion.title || ""
          : "",

      createdAt:
        new Date().toISOString(),

      date:
        new Date().toISOString()

    });


    saveJSON(
      "noveloraAdminActivities",
      activities
    );

  }


  /* =========================================================
     MESSAGE
  ========================================================= */

  function showMessage(
    message,
    type
  ) {

    unlockMessage.className =
      "chapter-message " +
      type;

    unlockMessage.textContent =
      message;

  }


  /* =========================================================
     SHOW CONTENT
  ========================================================= */

  function showChapterContent() {

    if (!currentChapter) {
      return;
    }


    const content =

      currentChapter.content ||

      currentChapter.chapterContent ||

      currentChapter.text ||

      currentChapter.body ||

      "";


    chapterContent.innerHTML =
      content || "<p>This chapter has no content yet.</p>";


    chapterContent.style.display =
      "block";

    lockScreen.style.display =
      "none";

  }


  /* =========================================================
     SHOW LOCK SCREEN
  ========================================================= */

  function showLockScreen(
    chapter,
    reader
  ) {

    const pricing =
      getEffectivePrice(chapter);


    lockScreen.style.display =
      "block";

    chapterContent.style.display =
      "none";


    unlockPriceEl.textContent =
      pricing.effectivePrice;


    if (pricing.promotion) {

      promotionBadge.style.display =
        "block";

      unlockPriceBox.innerHTML =
        "🪙 " +

        '<span class="promo-old-price">' +

        pricing.normalPrice +

        "</span>" +

        '<span class="promo-price">' +

        pricing.effectivePrice +

        "</span>" +

        " Coins";


      if (pricing.promotion.endDate) {

        const end =
          new Date(
            pricing.promotion.endDate
          );

        if (!isNaN(end.getTime())) {

          promotionExpiry.style.display =
            "block";

          promotionExpiry.textContent =
            "Offer ends " +
            end.toLocaleDateString(
              undefined,
              {
                year: "numeric",
                month: "short",
                day: "numeric"
              }
            );

        }

      }

    } else {

      promotionBadge.style.display =
        "none";

      promotionExpiry.style.display =
        "none";

      unlockPriceBox.innerHTML =
        "🪙 <span id=\"unlockPrice\">" +
        pricing.effectivePrice +
        "</span> Coins";

    }


    updateCoinDisplays(reader);

  }


  /* =========================================================
     UNLOCK CHAPTER
  ========================================================= */

  function unlockChapter() {

    if (!currentChapter) {
      return;
    }


    const reader =
      getReader();


    /*
     * Re-check the promotion at the moment of purchase.
     * This prevents an expired promotion from being charged.
     */

    const pricing =
      getEffectivePrice(currentChapter);


    const price =
      pricing.effectivePrice;


    const balance =
      getCoins(reader);


    if (isChapterUnlocked(reader)) {

      showChapterContent();

      return;

    }


    if (price <= 0) {

      recordUnlock(
        reader,
        currentChapter,
        0,
        pricing.promotion
      );

      recordActivity(
        reader,
        currentChapter,
        0,
        pricing.promotion
      );

      showChapterContent();

      return;

    }


    if (balance < price) {

      showMessage(

        "You need " +
        price +
        " coins to unlock this chapter, but you only have " +
        balance +
        ".",

        "error"

      );

      return;

    }


    unlockButton.disabled =
      true;

    unlockButton.textContent =
      "Unlocking...";


    /*
     * Deduct the ACTUAL effective price.
     */

    const newBalance =
      balance - price;


    saveReaderCoins(
      reader,
      newBalance
    );


    recordUnlock(
      reader,
      currentChapter,
      price,
      pricing.promotion
    );


    recordTransaction(
      reader,
      currentChapter,
      price,
      pricing.promotion
    );


    recordActivity(
      reader,
      currentChapter,
      price,
      pricing.promotion
    );


    showMessage(

      pricing.promotion

        ? "Chapter unlocked for " +
          price +
          " coins! 🔥"

        : "Chapter unlocked successfully! 💗",

      "success"

    );


    setTimeout(function () {

      showChapterContent();

    }, 350);

  }


  /* =========================================================
     CHAPTER NAVIGATION
  ========================================================= */

  function renderNavigation() {

    const publishedChapters =
      adminChapters

        .filter(function (chapter) {

          const chapterBook =
            chapter.bookId ||
            chapter.bookID ||
            chapter.book;

          const status =
            String(
              chapter.status || ""
            ).toLowerCase();

          return (

            String(chapterBook) ===
            String(bookId)

            &&

            (
              status === "published" ||
              status === "publish" ||
              status === "live"
            )

          );

        })

        .sort(function (a, b) {

          const aNumber =
            Number(
              a.chapterNumber ||
              a.number ||
              a.chapter ||
              0
            );

          const bNumber =
            Number(
              b.chapterNumber ||
              b.number ||
              b.chapter ||
              0
            );

          return aNumber - bNumber;

        });


    const currentIndex =
      publishedChapters.findIndex(
        function (chapter) {

          const number =
            chapter.chapterNumber ||
            chapter.number ||
            chapter.chapter;

          return (
            String(number) ===
            String(chapterNumber)
          );

        }
      );


    chapterNavigation.innerHTML =
      "";


    if (
      currentIndex > 0
    ) {

      const previous =
        publishedChapters[
          currentIndex - 1
        ];

      const previousNumber =
        previous.chapterNumber ||
        previous.number ||
        previous.chapter;

      const previousTitle =
        previous.title ||
        previous.chapterTitle ||
        "Previous Chapter";


      const previousLink =
        document.createElement("a");

      previousLink.href =
        "chapter.html?book=" +
        encodeURIComponent(bookId) +
        "&chapter=" +
        encodeURIComponent(previousNumber);

      previousLink.innerHTML =
        '<span class="nav-label">← Previous</span>' +
        '<span class="nav-title">' +
        escapeHTML(previousTitle) +
        "</span>";

      chapterNavigation.appendChild(
        previousLink
      );

    } else {

      const spacer =
        document.createElement("div");

      spacer.style.flex = "1";

      chapterNavigation.appendChild(
        spacer
      );

    }


    if (
      currentIndex !== -1 &&
      currentIndex <
      publishedChapters.length - 1
    ) {

      const next =
        publishedChapters[
          currentIndex + 1
        ];

      const nextNumber =
        next.chapterNumber ||
        next.number ||
        next.chapter;

      const nextTitle =
        next.title ||
        next.chapterTitle ||
        "Next Chapter";


      const nextLink =
        document.createElement("a");

      nextLink.className =
        "next";

      nextLink.href =
        "chapter.html?book=" +
        encodeURIComponent(bookId) +
        "&chapter=" +
        encodeURIComponent(nextNumber);

      nextLink.innerHTML =
        '<span class="nav-label">Next →</span>' +
        '<span class="nav-title">' +
        escapeHTML(nextTitle) +
        "</span>";

      chapterNavigation.appendChild(
        nextLink
      );

    } else {

      const spacer =
        document.createElement("div");

      spacer.style.flex = "1";

      chapterNavigation.appendChild(
        spacer
      );

    }

  }


  /* =========================================================
     SAFE HTML
  ========================================================= */

  function escapeHTML(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================================
     GLOBAL CURRENT DATA
  ========================================================= */

  let currentBook =
    null;

  let currentChapter =
    null;


  /* =========================================================
     INITIALIZE
  ========================================================= */

  function initialize() {

    if (!bookId || !chapterNumber) {

      loadingState.textContent =
        "Chapter information is missing.";

      return;

    }


    currentBook =
      findBook();

    currentChapter =
      findChapter();


    if (!currentBook) {

      loadingState.textContent =
        "Book not found.";

      return;

    }


    if (!currentChapter) {

      loadingState.textContent =
        "Chapter not found.";

      return;

    }


    const status =
      String(
        currentChapter.status || ""
      ).toLowerCase();


    /*
     * Only published chapters can be read.
     */

    if (
      status !== "published" &&
      status !== "publish" &&
      status !== "live"
    ) {

      loadingState.textContent =
        "This chapter is not published yet.";

      return;

    }


    const reader =
      getReader();


    const title =
      currentBook.title ||
      currentBook.bookTitle ||
      "Untitled Book";


    const chapterTitle =
      currentChapter.title ||
      currentChapter.chapterTitle ||
      ("Chapter " + chapterNumber);


    const words =
      currentChapter.wordCount ||
      currentChapter.words ||
      "";


    bookTitleEl.textContent =
      title;


    chapterTitleEl.textContent =
      chapterTitle;


    chapterMetaEl.textContent =
      words
        ? "Chapter " +
          chapterNumber +
          " · " +
          words +
          " words"

        : "Chapter " +
          chapterNumber;


    backToBook.href =
      "book-details.html?id=" +
      encodeURIComponent(bookId);


    const access =
      String(
        currentChapter.access ||
        currentChapter.accessType ||
        currentChapter.type ||
        ""
      ).toLowerCase();


    const isFree =
      access === "free";


    const pricing =
      getEffectivePrice(
        currentChapter
      );


    if (isFree) {

      chapterStatusEl.textContent =
        "🆓 Free Chapter";

    } else if (pricing.promotion) {

      chapterStatusEl.textContent =
        "🔥 " +
        pricing.effectivePrice +
        " Coins · Limited Offer";

    } else {

      chapterStatusEl.textContent =
        "🪙 " +
        pricing.normalPrice +
        " Coins";

    }


    updateCoinDisplays(
      reader
    );


    /*
     * Free chapter.
     */

    if (isFree) {

      showChapterContent();

    }

    /*
     * Already unlocked.
     */

    else if (
      isChapterUnlocked(reader)
    ) {

      showChapterContent();

    }

    /*
     * Locked paid chapter.
     */

    else {

      showLockScreen(
        currentChapter,
        reader
      );

    }


    renderNavigation();


    chapterArea.style.display =
      "block";

    loadingState.style.display =
      "none";

  }


  /* =========================================================
     BUTTON
  ========================================================= */

  unlockButton.addEventListener(
    "click",
    unlockChapter
  );


  /* =========================================================
     START
  ========================================================= */

  initialize();

})();
</script>
