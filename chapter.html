<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter — Novelora</title>

  <style>
    :root {
      --bg: #120912;
      --panel: #1c101c;
      --panel-2: #241323;
      --border: rgba(255,255,255,0.08);
      --text: #fff;
      --muted: #bcaebd;
      --pink: #ff4fa3;
      --pink-soft: #ff8bc5;
      --danger: #ff5c7c;
      --success: #62e6a7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(255,79,163,.13), transparent 32%),
        radial-gradient(circle at bottom right, rgba(255,139,197,.08), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    a {
      font-family: inherit;
    }

    .chapter-page {
      min-height: 100vh;
      padding: 28px 18px 50px;
    }

    .chapter-wrap {
      width: min(920px, 100%);
      margin: auto;
    }

    .chapter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 38px;
    }

    .back-btn,
    .coin-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: white;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .back-btn:hover,
    .coin-btn:hover {
      border-color: rgba(255,79,163,.55);
      background: rgba(255,79,163,.12);
    }

    .coin-btn {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .chapter-heading {
      margin-bottom: 25px;
    }

    .chapter-book {
      color: var(--pink-soft);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: .4px;
    }

    .chapter-title {
      font-size: clamp(28px, 5vw, 46px);
      line-height: 1.12;
      margin: 0 0 13px;
    }

    .chapter-meta {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    .chapter-status {
      display: inline-flex;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,79,163,.1);
      color: var(--pink-soft);
      font: 700 11px Arial, sans-serif;
    }

    .chapter-card {
      position: relative;
      background: linear-gradient(145deg, rgba(36,19,35,.96), rgba(25,13,24,.98));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: clamp(22px, 5vw, 48px);
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }

    .loading-message,
    .error-message {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      font-family: Arial, sans-serif;
    }

    .error-message {
      color: #ff9aac;
    }

    #chapterContent {
      font-size: 19px;
      line-height: 2;
      color: #f8eef5;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    /*
      IMPORTANT:
      Dialogue paragraphs beginning with quotation marks are indented.
      Normal narration paragraphs remain aligned normally.
    */
    #chapterContent p {
      margin: 0 0 1.35em;
      padding: 0;
    }

    #chapterContent p.dialogue {
  padding-left: 2em;
}

   
  #chapterContent p:last-child {
      margin-bottom: 0;
    }

    .lock-screen {
      text-align: center;
      padding: 30px 10px;
    }

    .lock-icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,79,163,.1);
      font-size: 28px;
    }

    .lock-screen h3 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .lock-screen p {
      margin: 0 auto 18px;
      max-width: 500px;
      color: var(--muted);
      line-height: 1.7;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .promotion-badge {
      display: none;
      width: fit-content;
      margin: 0 auto 14px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(98,230,167,.12);
      color: var(--success);
      font: 800 11px Arial, sans-serif;
    }

    .unlock-price-box {
      margin: 20px auto;
      width: fit-content;
      min-width: 160px;
      padding: 14px 20px;
      border: 1px solid rgba(255,79,163,.22);
      border-radius: 15px;
      background: rgba(255,79,163,.06);
    }

    .unlock-price {
      color: var(--pink-soft);
      font-size: 24px;
      font-weight: 800;
    }

    .promotion-expiry {
      color: var(--success);
      font: 700 11px Arial, sans-serif;
      margin-top: 5px;
    }

    .unlock-button {
      border: 0;
      background: var(--pink);
      color: #090509;
      border-radius: 13px;
      padding: 13px 24px;
      cursor: pointer;
      font: 800 14px Arial, sans-serif;
    }

    .unlock-button:hover {
      background: var(--pink-soft);
      transform: translateY(-1px);
    }

    .coin-balance {
      color: var(--muted);
      font: 700 12px Arial, sans-serif;
      margin-top: 13px;
    }

    .unlock-message {
      color: #ff9aac;
      font: 700 12px Arial, sans-serif;
      margin-top: 12px;
    }

    .chapter-navigation {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
    }

    .chapter-navigation a,
    .chapter-navigation button {
      flex: 1;
      text-decoration: none;
      text-align: center;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: white;
      border-radius: 13px;
      padding: 13px 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .chapter-navigation a:hover,
    .chapter-navigation button:hover {
      border-color: rgba(255,79,163,.5);
      background: rgba(255,79,163,.1);
    }

    .chapter-navigation .disabled {
      opacity: .35;
      pointer-events: none;
    }

    footer {
      text-align: center;
      color: #776a75;
      font: 12px Arial, sans-serif;
      margin-top: 35px;
    }

    @media (max-width: 650px) {
      .chapter-page {
        padding: 18px 12px 35px;
      }

      .chapter-top {
        margin-bottom: 28px;
      }

      .chapter-card {
        border-radius: 17px;
        padding: 24px 18px;
      }

      #chapterContent {
        font-size: 17px;
        line-height: 1.9;
      }

      #chapterContent p.dialogue {
        text-indent: 1.5em;
      }

      .chapter-navigation {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="chapter-page">
  <div class="chapter-wrap">

    <div class="chapter-top">
      <button class="back-btn" id="backToBook">← Back to Book</button>

      <button class="coin-btn" onclick="location.href='coins.html'">
        🪙 <span id="topCoins">0</span>
      </button>
    </div>

    <div id="loadingState" class="loading-message">
      Loading chapter...
    </div>

    <main id="chapterArea" style="display:none;">

      <div class="chapter-heading">
        <div class="chapter-book" id="bookTitle"></div>

        <h1 class="chapter-title" id="chapterTitle"></h1>

        <div class="chapter-meta" id="chapterMeta"></div>

        <div class="chapter-status" id="chapterStatus"></div>
      </div>

      <article class="chapter-card">

        <div id="lockScreen" class="lock-screen" style="display:none;">

          <div class="lock-icon">🔒</div>

          <h3>This chapter is locked</h3>

          <p>
            Unlock this chapter with coins to continue reading.
          </p>

          <div id="promotionBadge" class="promotion-badge"></div>

          <div class="unlock-price-box">
            <div class="unlock-price">
              🪙 <span id="unlockPrice">5</span>
            </div>

            <div id="promotionExpiry" class="promotion-expiry"></div>
          </div>

          <button id="unlockButton" class="unlock-button">
            Unlock Chapter
          </button>

          <div class="coin-balance">
            Your balance: 🪙 <span id="coinBalance">0</span>
          </div>

          <div id="unlockMessage" class="unlock-message"></div>

        </div>

        <div id="chapterContent"></div>

      </article>

      <div id="chapterNavigation" class="chapter-navigation"></div>

    </main>

    <div id="pageError" class="error-message" style="display:none;"></div>

    <footer>
      © Novelora — Your next story awaits.
    </footer>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const params = new URLSearchParams(window.location.search);

const chapterId = params.get("id");
const bookId = params.get("bookId");

let currentUser = null;
let currentBook = null;
let chapterList = [];
let currentChapter = null;
let coinBalance = 0;
let effectivePrice = 5;
let activePromotion = null;


/* =========================
   HELPERS
========================= */

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatNumber(value) {
  return Number(value || 0).toLocaleString();
}

function showError(message) {
  document.getElementById("loadingState").style.display = "none";
  document.getElementById("chapterArea").style.display = "none";

  const error = document.getElementById("pageError");
  error.textContent = message;
  error.style.display = "block";
}


/* =========================
   CURRENT USER
========================= */

async function loadCurrentUser() {
  const {
    data: {
      user
    }
  } = await supabaseClient.auth.getUser();

  currentUser = user || null;
}


/* =========================
   COINS
========================= */

async function loadCoinBalance() {

  if (!currentUser) {
    coinBalance = 0;
    document.getElementById("topCoins").textContent = "0";
    document.getElementById("coinBalance").textContent = "0";
    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("coins, coin_balance")
    .eq("id", currentUser.id)
    .single();

  if (error) {
    console.error("Could not load coins:", error);
    return;
  }

  coinBalance =
    Number(data?.coins ?? data?.coin_balance ?? 0);

  document.getElementById("topCoins").textContent =
    formatNumber(coinBalance);

  document.getElementById("coinBalance").textContent =
    formatNumber(coinBalance);
}


/* =========================
   BOOK
========================= */

async function loadBook() {

  const { data, error } = await supabaseClient
    .from("books")
    .select("*")
    .eq("id", bookId)
    .single();

  if (error || !data) {
    throw new Error("Book could not be found.");
  }

  currentBook = data;

  document.getElementById("bookTitle").textContent =
    data.title || "Novelora Book";
}


/* =========================
   CHAPTER LIST
========================= */

async function loadChapterList() {

  let query = await supabaseClient
    .from("chapters")
    .select("*")
    .eq("book_id", bookId)
    .eq("status", "published")
    .order("chapter_number", {
      ascending: true
    });

  if (query.error) {

    query = await supabaseClient
      .from("chapters")
      .select("*")
      .eq("book_id", bookId)
      .order("chapter_number", {
        ascending: true
      });
  }

  if (query.error) {
    throw new Error("Chapters could not be loaded.");
  }

  chapterList = query.data || [];

  currentChapter =
    chapterList.find(
      chapter => String(chapter.id) === String(chapterId)
    );

  if (!currentChapter) {
    throw new Error("This chapter could not be found.");
  }
}


/* =========================
   PROMOTIONS
========================= */

function getActivePromotion() {

  try {

    const promotions =
      JSON.parse(
        localStorage.getItem("noveloraPromotions") || "[]"
      );

    const now = new Date();

    const promotion = promotions.find(promo => {

      if (
        String(promo.bookId) !==
        String(bookId)
      ) {
        return false;
      }

      const start =
        promo.startDate
          ? new Date(promo.startDate)
          : null;

      const end =
        promo.endDate
          ? new Date(promo.endDate)
          : null;

      const isActive =
        (!start || now >= start) &&
        (!end || now <= end);

      const isDiscount =
        String(promo.type || "")
          .toLowerCase()
          .includes("discount");

      const price =
        Number(promo.discountCoins);

      return (
        isActive &&
        isDiscount &&
        Number.isFinite(price) &&
        price >= 0
      );
    });

    return promotion || null;

  } catch (error) {
    console.error(error);
    return null;
  }
}


/* =========================
   EFFECTIVE PRICE
========================= */

function getEffectivePrice(chapter) {

  const normalPrice =
    Number(
      chapter.coin_price ??
      chapter.price ??
      currentBook.chapter_price ??
      5
    );

  activePromotion =
    getActivePromotion();

  if (!activePromotion) {
    return normalPrice;
  }

  const promoPrice =
    Number(activePromotion.discountCoins);

  if (
    Number.isFinite(promoPrice) &&
    promoPrice < normalPrice
  ) {
    return promoPrice;
  }

  return normalPrice;
}


/* =========================
   CHECK UNLOCK
========================= */

async function isChapterUnlocked() {

  if (!currentUser) {
    return false;
  }

  const { data, error } =
    await supabaseClient
      .from("chapter_unlocks")
      .select("id")
      .eq("user_id", currentUser.id)
      .eq("chapter_id", currentChapter.id)
      .limit(1);

  if (error) {
    console.error(
      "Could not check chapter unlock:",
      error
    );

    return false;
  }

  return Boolean(data && data.length);
}


/* =========================
   CHAPTER CONTENT FORMATTER
========================= */

function renderChapterContent(content) {

  const chapterContent =
    document.getElementById("chapterContent");

  const raw =
    String(content ?? "")
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n");

  /*
    Blank lines create separate paragraphs.

    Example:

    "Yh I figured out".

    He looked at her and grinned.

    "Took you so long".

    becomes three separate paragraphs.
  */

  const paragraphs =
    raw.split(/\n\s*\n/);

  chapterContent.innerHTML =
    paragraphs
      .map(paragraph => {

        const clean =
          paragraph.trim();

        if (!clean) {
          return "";
        }

        const safe =
          escapeHTML(clean)
            .replace(/\n/g, "<br>");

        /*
          Detect dialogue paragraphs.

          A paragraph beginning with:
          "
          “
          ' 
          ‘

          receives the dialogue class.
        */

        const isDialogue =
          /^["“'‘]/.test(clean);

        return `
          <p class="${isDialogue ? "dialogue" : ""}">
            ${safe}
          </p>
        `;

      })
      .join("");
}


/* =========================
   RENDER CHAPTER
========================= */

async function renderChapter() {

  const chapter =
    currentChapter;

  document.getElementById("chapterTitle")
    .textContent =
      chapter.title ||
      `Chapter ${chapter.chapter_number}`;

  document.getElementById("chapterMeta")
    .textContent =
      `Chapter ${chapter.chapter_number || ""}`;

  const isFree =
    Boolean(
      chapter.is_free ??
      chapter.free ??
      false
    );

  effectivePrice =
    getEffectivePrice(chapter);

  document.getElementById("unlockPrice")
    .textContent =
      formatNumber(effectivePrice);

  document.getElementById("coinBalance")
    .textContent =
      formatNumber(coinBalance);

  const status =
    document.getElementById("chapterStatus");

  status.textContent =
    isFree
      ? "FREE CHAPTER"
      : `🪙 ${formatNumber(effectivePrice)} COINS`;

  /*
    Promotion display
  */

  const promotionBadge =
    document.getElementById("promotionBadge");

  const promotionExpiry =
    document.getElementById("promotionExpiry");

  if (
    activePromotion &&
    effectivePrice <
      Number(
        chapter.coin_price ??
        chapter.price ??
        currentBook.chapter_price ??
        5
      )
  ) {

    promotionBadge.textContent =
      "LIMITED-TIME DISCOUNT";

    promotionBadge.style.display =
      "block";

    if (activePromotion.endDate) {

      const expiry =
        new Date(activePromotion.endDate);

      promotionExpiry.textContent =
        `Offer ends ${expiry.toLocaleDateString()}`;
    }

  } else {

    promotionBadge.style.display =
      "none";

    promotionExpiry.textContent =
      "";
  }


  /*
    Free chapter
  */

  if (isFree) {

    document.getElementById("lockScreen")
      .style.display = "none";

    renderChapterContent(
      chapter.content || ""
    );

    return;
  }


  /*
    Paid chapter
  */

  const unlocked =
    await isChapterUnlocked();

  if (unlocked) {

    document.getElementById("lockScreen")
      .style.display = "none";

    renderChapterContent(
      chapter.content || ""
    );

    return;
  }


  /*
    Locked
  */

  document.getElementById("chapterContent")
    .innerHTML = "";

  document.getElementById("lockScreen")
    .style.display = "block";

  if (!currentUser) {

    document.getElementById("unlockButton")
      .textContent =
        "Log in to Unlock";

    document.getElementById("unlockButton")
      .onclick = () => {
        location.href = "login.html";
      };

  } else {

    document.getElementById("unlockButton")
      .textContent =
        `Unlock for ${effectivePrice} Coins`;

    document.getElementById("unlockButton")
      .onclick =
        unlockChapter;
  }
}


/* =========================
   UNLOCK CHAPTER
========================= */

async function unlockChapter() {

  const message =
    document.getElementById("unlockMessage");

  message.textContent = "";

  if (!currentUser) {
    location.href = "login.html";
    return;
  }

  await loadCoinBalance();

  if (coinBalance < effectivePrice) {

    message.textContent =
      "You don't have enough coins.";

    return;
  }

  const price =
    effectivePrice;

  const balanceField =
    "coins";

  /*
    Read the profile again before deduction.
  */

  const { data: profile, error: profileError } =
    await supabaseClient
      .from("profiles")
      .select("coins, coin_balance")
      .eq("id", currentUser.id)
      .single();

  if (profileError || !profile) {

    message.textContent =
      "Could not verify your coin balance.";

    return;
  }

  const currentCoins =
    Number(
      profile.coins ??
      profile.coin_balance ??
      0
    );

  if (currentCoins < price) {

    message.textContent =
      "You don't have enough coins.";

    return;
  }

  const newBalance =
    currentCoins - price;

  /*
    Determine which field exists.
  */

  const updateData =
    profile.coins !== null &&
    profile.coins !== undefined
      ? { coins: newBalance }
      : { coin_balance: newBalance };

  const { error: updateError } =
    await supabaseClient
      .from("profiles")
      .update(updateData)
      .eq("id", currentUser.id);

  if (updateError) {

    console.error(updateError);

    message.textContent =
      "Could not update your coins.";

    return;
  }

  /*
    Record unlock.
  */

  const { error: unlockError } =
    await supabaseClient
      .from("chapter_unlocks")
      .insert({
        user_id: currentUser.id,
        chapter_id: currentChapter.id,
        book_id: bookId,
        coins_spent: price
      });

  if (unlockError) {

    console.error(unlockError);

    /*
      Restore coins if unlock record fails.
    */

    await supabaseClient
      .from("profiles")
      .update(
        profile.coins !== null &&
        profile.coins !== undefined
          ? { coins: currentCoins }
          : { coin_balance: currentCoins }
      )
      .eq("id", currentUser.id);

    message.textContent =
      "The chapter could not be unlocked. Your coins were not charged.";

    return;
  }


  /*
    Try recording coin transaction.
    This is intentionally optional so a schema mismatch
    does not break a successful chapter unlock.
  */

  try {

    await supabaseClient
      .from("coin_transactions")
      .insert({
        user_id: currentUser.id,
        amount: -price,
        type: "chapter_unlock",
        chapter_id: currentChapter.id,
        book_id: bookId
      });

  } catch (error) {
    console.warn(
      "Coin transaction log skipped:",
      error
    );
  }

  coinBalance =
    newBalance;

  document.getElementById("topCoins")
    .textContent =
      formatNumber(coinBalance);

  document.getElementById("coinBalance")
    .textContent =
      formatNumber(coinBalance);

  /*
    Show chapter.
  */

  document.getElementById("lockScreen")
    .style.display = "none";

  renderChapterContent(
    currentChapter.content || ""
  );
}


/* =========================
   PREVIOUS / NEXT
========================= */

function renderNavigation() {

  const navigation =
    document.getElementById(
      "chapterNavigation"
    );

  const index =
    chapterList.findIndex(
      chapter =>
        String(chapter.id) ===
        String(currentChapter.id)
    );

  const previous =
    index > 0
      ? chapterList[index - 1]
      : null;

  const next =
    index < chapterList.length - 1
      ? chapterList[index + 1]
      : null;

  navigation.innerHTML = `
    ${
      previous
        ? `
          <button
            type="button"
            onclick="switchToChapter('${previous.id}')"
          >
            ← Previous Chapter
          </button>
        `
        : `
          <button
            type="button"
            class="disabled"
          >
            ← Previous Chapter
          </button>
        `
    }

    ${
      next
        ? `
          <button
            type="button"
            onclick="switchToChapter('${next.id}')"
          >
            Next Chapter →
          </button>
        `
        : `
          <button
            type="button"
            class="disabled"
          >
            Next Chapter →
          </button>
        `
    }
  `;
}


/* =========================
   SWITCH CHAPTER
========================= */

async function switchToChapter(nextChapterId) {

  const nextChapter =
    chapterList.find(
      chapter =>
        String(chapter.id) ===
        String(nextChapterId)
    );

  if (!nextChapter) {
    return;
  }

  currentChapter =
    nextChapter;

  history.pushState(
    {},
    "",
    `chapter.html?id=${encodeURIComponent(nextChapter.id)}&bookId=${encodeURIComponent(bookId)}`
  );

  document.getElementById("chapterContent")
    .innerHTML = "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  await renderChapter();

  renderNavigation();
}


/* =========================
   BROWSER BACK / FORWARD
========================= */

window.addEventListener(
  "popstate",
  async () => {

    const newParams =
      new URLSearchParams(
        window.location.search
      );

    const newChapterId =
      newParams.get("id");

    const found =
      chapterList.find(
        chapter =>
          String(chapter.id) ===
          String(newChapterId)
      );

    if (!found) {
      return;
    }

    currentChapter =
      found;

    await renderChapter();

    renderNavigation();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }
);


/* =========================
   BACK TO BOOK
========================= */

document.getElementById(
  "backToBook"
).onclick = () => {

  if (bookId) {
    location.href =
      `book-details.html?id=${encodeURIComponent(bookId)}`;
  } else {
    location.href =
      "reader-dashboard.html";
  }
};


/* =========================
   INITIALIZE
========================= */

async function initialize() {

  try {

    if (!chapterId || !bookId) {
      throw new Error(
        "This chapter link is incomplete."
      );
    }

    await loadCurrentUser();

    await loadBook();

    await loadChapterList();

    await loadCoinBalance();

    document.getElementById("loadingState")
      .style.display = "none";

    document.getElementById("chapterArea")
      .style.display = "block";

    await renderChapter();

    renderNavigation();

  } catch (error) {

    console.error(error);

    showError(
      error.message ||
      "Something went wrong while loading this chapter."
    );
  }
}

initialize();
</script>
