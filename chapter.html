<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter | Novelora</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .chapter-page {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(255, 105, 180, 0.12), transparent 35%),
        radial-gradient(circle at bottom left, rgba(255, 20, 147, 0.08), transparent 35%);
      padding-bottom: 80px;
    }

    .chapter-wrap {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding-top: 28px;
    }

    .chapter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .back-btn,
    .coin-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .back-btn {
      background: rgba(255,255,255,0.07);
      color: inherit;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .coin-btn {
      background: linear-gradient(135deg, #ff4f9a, #ff76b5);
      color: white;
      border: none;
      box-shadow: 0 8px 25px rgba(255, 79, 154, 0.2);
    }

    .back-btn:hover,
    .coin-btn:hover {
      transform: translateY(-2px);
    }

    .chapter-heading {
      text-align: center;
      margin: 20px auto 35px;
    }

    .chapter-book {
      color: #ff72ad;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .chapter-heading h1 {
      font-size: clamp(28px, 5vw, 44px);
      margin: 0 0 10px;
      line-height: 1.15;
    }

    .chapter-heading p {
      margin: 0;
      opacity: 0.65;
    }

    .chapter-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 15px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 105, 180, 0.1);
      color: #ff72ad;
      font-size: 13px;
      font-weight: 700;
    }

    .chapter-card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .chapter-content {
      padding: clamp(22px, 5vw, 50px);
      font-size: 18px;
      line-height: 2;
    }

    .chapter-content p {
      margin: 0 0 1.5em;
    }

    .chapter-content h2,
    .chapter-content h3 {
      line-height: 1.3;
      margin-top: 1.8em;
    }

    .chapter-content img {
      max-width: 100%;
      border-radius: 14px;
    }

    .chapter-lock {
      padding: 55px 25px;
      text-align: center;
    }

    .lock-icon {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      background: rgba(255, 105, 180, 0.12);
      font-size: 36px;
    }

    .chapter-lock h2 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .chapter-lock p {
      max-width: 500px;
      margin: 0 auto 22px;
      opacity: 0.7;
      line-height: 1.6;
    }

    .unlock-price {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 105, 180, 0.1);
      color: #ff72ad;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .unlock-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      cursor: pointer;
      padding: 14px 26px;
      border-radius: 13px;
      background: linear-gradient(135deg, #ff3f92, #ff78b8);
      color: white;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(255, 63, 146, 0.25);
      transition: 0.2s ease;
    }

    .unlock-btn:hover {
      transform: translateY(-2px);
    }

    .unlock-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .coin-balance {
      margin-top: 15px;
      font-size: 14px;
      opacity: 0.7;
    }

    .chapter-message {
      margin: 20px auto 0;
      max-width: 520px;
      padding: 13px 16px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .chapter-message.error {
      display: block;
      background: rgba(255, 70, 70, 0.1);
      border: 1px solid rgba(255, 70, 70, 0.18);
      color: #ff9b9b;
    }

    .chapter-message.success {
      display: block;
      background: rgba(60, 220, 140, 0.1);
      border: 1px solid rgba(60, 220, 140, 0.18);
      color: #8ff0b8;
    }

    .chapter-nav {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 25px;
    }

    .chapter-nav a,
    .chapter-nav button {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.045);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .chapter-nav a:hover,
    .chapter-nav button:hover {
      background: rgba(255,105,180,0.1);
    }

    .chapter-nav .next {
      text-align: right;
    }

    .nav-label {
      display: block;
      font-size: 12px;
      opacity: 0.55;
      margin-bottom: 4px;
    }

    .nav-title {
      display: block;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chapter-footer {
      text-align: center;
      margin-top: 35px;
      opacity: 0.5;
      font-size: 13px;
    }

    .loading-state,
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .chapter-wrap {
        width: min(100% - 20px, 900px);
        padding-top: 15px;
      }

      .chapter-content {
        padding: 24px 19px;
        font-size: 17px;
        line-height: 1.9;
      }

      .chapter-top {
        margin-bottom: 15px;
      }

      .chapter-heading {
        margin-bottom: 25px;
      }

      .chapter-nav {
        flex-direction: column;
      }

      .chapter-nav .next {
        text-align: left;
      }
    }
  </style>
</head>

<body class="reader-page chapter-page">

  <main class="chapter-wrap">

    <div class="chapter-top">
      <a href="#" id="backToBook" class="back-btn">
        ← Back to Book
      </a>

      <a href="coins.html" class="coin-btn">
        🪙 <span id="topCoins">0</span> Coins
      </a>
    </div>

    <div id="loadingState" class="loading-state">
      Loading chapter...
    </div>

    <div id="chapterArea" style="display:none;">

      <header class="chapter-heading">
        <div id="bookTitle" class="chapter-book"></div>

        <h1 id="chapterTitle"></h1>

        <p id="chapterMeta"></p>

        <div id="chapterStatus" class="chapter-status"></div>
      </header>

      <section class="chapter-card">

        <!-- LOCKED CHAPTER -->
        <div id="lockScreen" class="chapter-lock" style="display:none;">

          <div class="lock-icon">🔒</div>

          <h2>This Chapter Is Locked</h2>

          <p>
            Unlock this chapter with coins to continue reading.
          </p>

          <div class="unlock-price">
            🪙 <span id="unlockPrice">5</span> Coins
          </div>

          <br>

          <button id="unlockButton" class="unlock-btn">
            🔓 Unlock Chapter
          </button>

          <div id="coinBalance" class="coin-balance">
            You have 0 coins
          </div>

          <div id="unlockMessage" class="chapter-message"></div>

        </div>

        <!-- CHAPTER CONTENT -->
        <article id="chapterContent" class="chapter-content" style="display:none;"></article>

      </section>

      <div id="chapterNavigation" class="chapter-nav"></div>

      <div class="chapter-footer">
        You're reading on Novelora · Your next story awaits.
      </div>

    </div>

  </main>


<script>
(function () {

  "use strict";

  /* =========================================================
     URL INFORMATION
  ========================================================= */

  const params = new URLSearchParams(window.location.search);

  const bookId = params.get("book");
  const chapterNumber = params.get("chapter");


  /* =========================================================
     DOM
  ========================================================= */

  const loadingState = document.getElementById("loadingState");
  const chapterArea = document.getElementById("chapterArea");

  const bookTitleEl = document.getElementById("bookTitle");
  const chapterTitleEl = document.getElementById("chapterTitle");
  const chapterMetaEl = document.getElementById("chapterMeta");
  const chapterStatusEl = document.getElementById("chapterStatus");

  const lockScreen = document.getElementById("lockScreen");
  const chapterContent = document.getElementById("chapterContent");

  const unlockPriceEl = document.getElementById("unlockPrice");
  const unlockButton = document.getElementById("unlockButton");
  const coinBalanceEl = document.getElementById("coinBalance");
  const unlockMessage = document.getElementById("unlockMessage");

  const topCoins = document.getElementById("topCoins");

  const backToBook = document.getElementById("backToBook");
  const chapterNavigation = document.getElementById("chapterNavigation");


  /* =========================================================
     LOCAL STORAGE HELPERS
  ========================================================= */

  function getJSON(key, fallback) {

    try {

      const value = localStorage.getItem(key);

      if (!value) {
        return fallback;
      }

      return JSON.parse(value);

    } catch (error) {

      console.error("Novelora storage error:", key, error);

      return fallback;
    }
  }


  function saveJSON(key, value) {

    localStorage.setItem(key, JSON.stringify(value));
  }


  /* =========================================================
     READ ADMIN DATA
  ========================================================= */

  const adminBooks = getJSON("noveloraAdminBooks", []);
  const adminChapters = getJSON("noveloraAdminChapters", []);


  /* =========================================================
     FIND BOOK
  ========================================================= */

  function findBook() {

    return adminBooks.find(function (book) {

      const id =
        book.id ||
        book.bookId ||
        book.bookID;

      return String(id) === String(bookId);

    });

  }


  /* =========================================================
     FIND CHAPTER
  ========================================================= */

  function findChapter() {

    return adminChapters.find(function (chapter) {

      const chapterBook =
        chapter.bookId ||
        chapter.bookID ||
        chapter.book;

      const number =
        chapter.chapterNumber ||
        chapter.number ||
        chapter.chapter;

      return (
        String(chapterBook) === String(bookId) &&
        String(number) === String(chapterNumber)
      );

    });

  }


  /* =========================================================
     GET READER
  =========================================================
     
     This supports several possible reader storage formats
     so the system can work with the existing Novelora
     reader system.
  ========================================================= */

  function getReader() {

    let reader =
      getJSON("noveloraCurrentReader", null);

    if (reader) {
      return reader;
    }


    reader =
      getJSON("noveloraReader", null);

    if (reader) {
      return reader;
    }


    const readers =
      getJSON("noveloraReaders", []);

    if (Array.isArray(readers) && readers.length) {

      /*
       * For the current demo/local system, use the first
       * reader if no separate current-reader record exists.
       */

      return readers[0];
    }


    /*
     * Create a local demo reader so the coin system can work
     * before real authentication is connected.
     */

    reader = {
      id: "reader_demo",
      username: "Reader",
      email: "",
      coins: 20,
      createdAt: new Date().toISOString()
    };

    saveJSON("noveloraCurrentReader", reader);

    return reader;
  }


  /* =========================================================
     GET READER COINS
  ========================================================= */

  function getCoins(reader) {

    const possibleCoins = [
      reader.coins,
      reader.coinBalance,
      reader.balance,
      reader.coinsBalance
    ];

    for (let i = 0; i < possibleCoins.length; i++) {

      if (
        possibleCoins[i] !== undefined &&
        possibleCoins[i] !== null &&
        !isNaN(Number(possibleCoins[i]))
      ) {

        return Number(possibleCoins[i]);
      }
    }

    return 0;
  }


  /* =========================================================
     SAVE READER COINS
  ========================================================= */

  function saveReaderCoins(reader, coins) {

    coins = Math.max(0, Number(coins) || 0);

    /*
     * Keep all common fields synchronized.
     */

    reader.coins = coins;
    reader.coinBalance = coins;


    saveJSON("noveloraCurrentReader", reader);


    /*
     * Also update the reader in the Admin reader collection
     * if one exists.
     */

    const readers =
      getJSON("noveloraReaders", []);

    if (Array.isArray(readers) && readers.length) {

      const readerId =
        reader.id ||
        reader.readerId ||
        reader.userId;

      const readerEmail =
        reader.email || "";


      const index = readers.findIndex(function (item) {

        const itemId =
          item.id ||
          item.readerId ||
          item.userId;

        return (
          (readerId && String(itemId) === String(readerId)) ||
          (readerEmail &&
           item.email &&
           String(item.email).toLowerCase() ===
           String(readerEmail).toLowerCase())
        );

      });


      if (index !== -1) {

        readers[index].coins = coins;
        readers[index].coinBalance = coins;

        saveJSON("noveloraReaders", readers);
      }
    }


    updateCoinDisplays(reader);
  }


  /* =========================================================
     COIN DISPLAY
  ========================================================= */

  function updateCoinDisplays(reader) {

    const coins = getCoins(reader);

    topCoins.textContent = coins;

    coinBalanceEl.textContent =
      "You have " +
      coins +
      " coin" +
      (coins === 1 ? "" : "s");

  }


  /* =========================================================
     UNLOCK STORAGE
  ========================================================= */

  function getUnlocks() {

    const unlocks =
      getJSON("noveloraChapterUnlocks", []);

    return Array.isArray(unlocks)
      ? unlocks
      : [];
  }


  function isChapterUnlocked(reader) {

    const unlocks = getUnlocks();

    const readerId =
      reader.id ||
      reader.readerId ||
      reader.userId ||
      reader.email ||
      "reader_demo";


    return unlocks.some(function (unlock) {

      const unlockReader =
        unlock.readerId ||
        unlock.userId ||
        unlock.readerEmail ||
        unlock.reader;

      const unlockBook =
        unlock.bookId ||
        unlock.bookID ||
        unlock.book;

      const unlockChapter =
        unlock.chapterNumber ||
        unlock.chapter ||
        unlock.number;

      return (
        String(unlockReader) === String(readerId) &&
        String(unlockBook) === String(bookId) &&
        String(unlockChapter) === String(chapterNumber)
      );

    });

  }


  /* =========================================================
     RECORD UNLOCK
  ========================================================= */

  function recordUnlock(reader, chapter, price) {

    const unlocks =
      getUnlocks();


    const readerId =
      reader.id ||
      reader.readerId ||
      reader.userId ||
      reader.email ||
      "reader_demo";


    const alreadyUnlocked =
      unlocks.some(function (unlock) {

        const unlockReader =
          unlock.readerId ||
          unlock.userId ||
          unlock.readerEmail ||
          unlock.reader;

        const unlockBook =
          unlock.bookId ||
          unlock.bookID ||
          unlock.book;

        const unlockChapter =
          unlock.chapterNumber ||
          unlock.chapter ||
          unlock.number;

        return (
          String(unlockReader) === String(readerId) &&
          String(unlockBook) === String(bookId) &&
          String(unlockChapter) === String(chapterNumber)
        );

      });


    if (alreadyUnlocked) {
      return;
    }


    const bookTitle =
      currentBook
        ? (
            currentBook.title ||
            currentBook.bookTitle ||
            "Untitled Book"
          )
        : "Untitled Book";


    const chapterTitle =
      chapter.title ||
      chapter.chapterTitle ||
      ("Chapter " + chapterNumber);


    unlocks.push({

      id:
        "unlock_" +
        Date.now() +
        "_" +
        Math.random().toString(36).slice(2, 8),

      readerId: readerId,

      readerEmail:
        reader.email || "",

      bookId: bookId,

      bookTitle: bookTitle,

      chapterNumber: Number(chapterNumber),

      chapterTitle: chapterTitle,

      coinsSpent: price,

      price: price,

      unlockedAt:
        new Date().toISOString()

    });


    saveJSON(
      "noveloraChapterUnlocks",
      unlocks
    );

  }


  /* =========================================================
     RECORD TRANSACTION
  ========================================================= */

  function recordTransaction(reader, chapter, price) {

    const transactions =
      getJSON("noveloraTransactions", []);


    const readerId =
      reader.id ||
      reader.readerId ||
      reader.userId ||
      reader.email ||
      "reader_demo";


    const bookTitle =
      currentBook
        ? (
            currentBook.title ||
            currentBook.bookTitle ||
            "Untitled Book"
          )
        : "Untitled Book";


    const chapterTitle =
      chapter.title ||
      chapter.chapterTitle ||
      ("Chapter " + chapterNumber);


    /*
     * Important:
     *
     * This is a coin-spending transaction, not a direct
     * cash payment. Therefore amount is kept at 0 so the
     * Admin Money page does not falsely report coin spending
     * as actual dollar revenue.
     *
     * coinsSpent is the important value for this event.
     */

    transactions.push({

      id:
        "tx_" +
        Date.now() +
        "_" +
        Math.random().toString(36).slice(2, 8),

      type: "chapter_unlock",

      status: "completed",

      readerId: readerId,

      readerEmail:
        reader.email || "",

      bookId: bookId,

      bookTitle: bookTitle,

      chapterNumber: Number(chapterNumber),

      chapterTitle: chapterTitle,

      coinsSpent: price,

      amount: 0,

      currency: "USD",

      date:
        new Date().toISOString(),

      createdAt:
        new Date().toISOString()

    });


    saveJSON(
      "noveloraTransactions",
      transactions
    );

  }


  /* =========================================================
     RECORD ADMIN ACTIVITY
  ========================================================= */

  function recordActivity(reader, chapter, price) {

    const activities =
      getJSON("noveloraAdminActivities", []);


    const bookTitle =
      currentBook
        ? (
            currentBook.title ||
            currentBook.bookTitle ||
            "Untitled Book"
          )
        : "Untitled Book";


    activities.unshift({

      id:
        "activity_" +
        Date.now(),

      type: "chapter_unlock",

      message:
        (reader.username ||
         reader.name ||
         reader.email ||
         "A reader") +
        " unlocked Chapter " +
        chapterNumber +
        " of " +
        bookTitle,

      readerId:
        reader.id ||
        reader.readerId ||
        reader.userId ||
        reader.email ||
        "reader_demo",

      bookId: bookId,

      chapterNumber:
        Number(chapterNumber),

      coinsSpent:
        price,

      createdAt:
        new Date().toISOString()

    });


    /*
     * Keep activity storage from growing endlessly.
     */

    if (activities.length > 500) {

      activities.splice(500);

    }


    saveJSON(
      "noveloraAdminActivities",
      activities
    );

  }


  /* =========================================================
     CURRENT DATA
  ========================================================= */

  let currentBook = null;
  let currentChapter = null;
  let currentReader = null;


  /* =========================================================
     NORMALIZE CHAPTER PRICE
  ========================================================= */

  function getChapterPrice(chapter) {

    const price =
      chapter.price ??
      chapter.coinPrice ??
      chapter.coins ??
      5;

    const number =
      Number(price);

    return (
      isNaN(number) || number < 0
        ? 5
        : number
    );

  }


  /* =========================================================
     CHAPTER ACCESS
  ========================================================= */

  function getChapterAccess(chapter) {

    const access =
      chapter.access ||
      chapter.accessType ||
      "Paid";

    return String(access).toLowerCase();

  }


  /* =========================================================
     CHAPTER STATUS
  ========================================================= */

  function isPublished(chapter) {

    const status =
      chapter.status ||
      "Published";

    return (
      String(status).toLowerCase() ===
      "published"
    );

  }


  /* =========================================================
     SHOW MESSAGE
  ========================================================= */

  function showUnlockMessage(message, type) {

    unlockMessage.textContent =
      message;

    unlockMessage.className =
      "chapter-message " +
      type;

  }


  /* =========================================================
     DISPLAY CONTENT
  ========================================================= */

  function showChapterContent() {

    const content =
      currentChapter.content ||
      currentChapter.chapterContent ||
      currentChapter.text ||
      currentChapter.body ||
      "";


    if (!content.trim()) {

      chapterContent.innerHTML = `
        <p>
          This chapter has been published, but no chapter
          content has been added yet.
        </p>
      `;

    } else {

      /*
       * Admin chapter content is entered as text.
       *
       * Convert normal line breaks into paragraphs.
       */

      const cleaned =
        String(content)
          .trim()
          .replace(/\r\n/g, "\n");


      /*
       * If the admin already entered HTML paragraphs,
       * preserve the basic HTML.
       *
       * Otherwise convert plain text into paragraphs.
       */

      if (
        /<p[\s>]/i.test(cleaned) ||
        /<br\s*\/?>/i.test(cleaned) ||
        /<h[1-6][\s>]/i.test(cleaned)
      ) {

        chapterContent.innerHTML =
          cleaned;

      } else {

        const paragraphs =
          cleaned
            .split(/\n\s*\n/)
            .map(function (paragraph) {

              return (
                "<p>" +
                paragraph
                  .trim()
                  .replace(/\n/g, "<br>") +
                "</p>"
              );

            })
            .join("");

        chapterContent.innerHTML =
          paragraphs;

      }

    }


    lockScreen.style.display =
      "none";

    chapterContent.style.display =
      "block";


    chapterStatusEl.textContent =
      getChapterAccess(currentChapter) === "free"
        ? "🆓 Free Chapter"
        : "🔓 Unlocked";

  }


  /* =========================================================
     SHOW LOCK
  ========================================================= */

  function showChapterLock(price) {

    lockScreen.style.display =
      "block";

    chapterContent.style.display =
      "none";

    unlockPriceEl.textContent =
      price;

    chapterStatusEl.textContent =
      "🔒 Locked";

    updateCoinDisplays(currentReader);

  }


  /* =========================================================
     UNLOCK CHAPTER
  ========================================================= */

  function unlockChapter() {

    if (!currentChapter || !currentReader) {
      return;
    }


    const price =
      getChapterPrice(currentChapter);


    const coins =
      getCoins(currentReader);


    /*
     * Double-check that the chapter hasn't already been
     * unlocked.
     */

    if (isChapterUnlocked(currentReader)) {

      showChapterContent();

      return;
    }


    if (coins < price) {

      showUnlockMessage(
        "You need " +
        price +
        " coins to unlock this chapter, but you only have " +
        coins +
        ". Tap your coin balance above to get more coins.",
        "error"
      );

      return;
    }


    unlockButton.disabled =
      true;

    unlockButton.textContent =
      "Unlocking...";


    /*
     * Deduct coins.
     */

    saveReaderCoins(
      currentReader,
      coins - price
    );


    /*
     * Record everything.
     */

    recordUnlock(
      currentReader,
      currentChapter,
      price
    );

    recordTransaction(
      currentReader,
      currentChapter,
      price
    );

    recordActivity(
      currentReader,
      currentChapter,
      price
    );


    showUnlockMessage(
      "Chapter unlocked successfully! 💕",
      "success"
    );


    setTimeout(function () {

      showChapterContent();

    }, 300);

  }


  /* =========================================================
     BUILD CHAPTER NAVIGATION
  ========================================================= */

  function buildNavigation() {

    const publishedChapters =
      adminChapters
        .filter(function (chapter) {

          const chapterBook =
            chapter.bookId ||
            chapter.bookID ||
            chapter.book;

          return (
            String(chapterBook) === String(bookId) &&
            isPublished(chapter)
          );

        })
        .sort(function (a, b) {

          const numberA =
            Number(
              a.chapterNumber ||
              a.number ||
              a.chapter ||
              0
            );

          const numberB =
            Number(
              b.chapterNumber ||
              b.number ||
              b.chapter ||
              0
            );

          return numberA - numberB;

        });


    const currentIndex =
      publishedChapters.findIndex(function (chapter) {

        const number =
          chapter.chapterNumber ||
          chapter.number ||
          chapter.chapter;

        return String(number) ===
          String(chapterNumber);

      });


    if (currentIndex === -1) {
      chapterNavigation.innerHTML = "";
      return;
    }


    const previous =
      publishedChapters[currentIndex - 1];

    const next =
      publishedChapters[currentIndex + 1];


    let html = "";


    if (previous) {

      const number =
        previous.chapterNumber ||
        previous.number ||
        previous.chapter;

      const title =
        previous.title ||
        previous.chapterTitle ||
        ("Chapter " + number);


      html += `
        <a href="chapter.html?book=${encodeURIComponent(bookId)}&chapter=${encodeURIComponent(number)}">
          <span class="nav-label">← Previous</span>
          <span class="nav-title">${escapeHTML(title)}</span>
        </a>
      `;

    } else {

      html += `
        <div style="opacity:.25;">
          <span class="nav-label">Previous</span>
          <span class="nav-title">First chapter</span>
        </div>
      `;

    }


    if (next) {

      const number =
        next.chapterNumber ||
        next.number ||
        next.chapter;

      const title =
        next.title ||
        next.chapterTitle ||
        ("Chapter " + number);


      html += `
        <a class="next" href="chapter.html?book=${encodeURIComponent(bookId)}&chapter=${encodeURIComponent(number)}">
          <span class="nav-label">Next →</span>
          <span class="nav-title">${escapeHTML(title)}</span>
        </a>
      `;

    } else {

      html += `
        <div class="next" style="opacity:.25;">
          <span class="nav-label">Next</span>
          <span class="nav-title">End of published chapters</span>
        </div>
      `;

    }


    chapterNavigation.innerHTML =
      html;

  }


  /* =========================================================
     ESCAPE HTML
  ========================================================= */

  function escapeHTML(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }
