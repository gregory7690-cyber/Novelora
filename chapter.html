<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter | Novelora</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .chapter-page {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(255, 105, 180, 0.12), transparent 35%),
        radial-gradient(circle at bottom left, rgba(255, 20, 147, 0.08), transparent 35%);
      padding-bottom: 80px;
    }

    .chapter-wrap {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding-top: 28px;
    }

    .chapter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .back-btn,
    .coin-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .back-btn {
      background: rgba(255,255,255,0.07);
      color: inherit;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .coin-btn {
      background: linear-gradient(135deg, #ff4f9a, #ff76b5);
      color: white;
      border: none;
      box-shadow: 0 8px 25px rgba(255, 79, 154, 0.2);
    }

    .back-btn:hover,
    .coin-btn:hover {
      transform: translateY(-2px);
    }

    .chapter-heading {
      text-align: center;
      margin: 20px auto 35px;
    }

    .chapter-book {
      color: #ff72ad;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .chapter-heading h1 {
      font-size: clamp(28px, 5vw, 44px);
      margin: 0 0 10px;
      line-height: 1.15;
    }

    .chapter-heading p {
      margin: 0;
      opacity: 0.65;
    }

    .chapter-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 15px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 105, 180, 0.1);
      color: #ff72ad;
      font-size: 13px;
      font-weight: 700;
    }

    .chapter-card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .chapter-content {
      padding: clamp(22px, 5vw, 50px);
      font-size: 18px;
      line-height: 2;
    }

    .chapter-content p {
      margin: 0 0 1.5em;
    }

    .chapter-content h2,
    .chapter-content h3 {
      line-height: 1.3;
      margin-top: 1.8em;
    }

    .chapter-content img {
      max-width: 100%;
      border-radius: 14px;
    }

    .chapter-lock {
      padding: 55px 25px;
      text-align: center;
    }

    .lock-icon {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      background: rgba(255, 105, 180, 0.12);
      font-size: 36px;
    }

    .chapter-lock h2 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .chapter-lock p {
      max-width: 500px;
      margin: 0 auto 22px;
      opacity: 0.7;
      line-height: 1.6;
    }

    .unlock-price {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 105, 180, 0.1);
      color: #ff72ad;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .promo-old-price {
      text-decoration: line-through;
      opacity: 0.5;
      margin-right: 4px;
    }

    .promo-price {
      color: #ff72ad;
      font-weight: 900;
    }

    .promo-badge {
      display: block;
      width: fit-content;
      margin: 0 auto 15px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 70, 150, 0.12);
      border: 1px solid rgba(255, 105, 180, 0.18);
      color: #ff72ad;
      font-size: 13px;
      font-weight: 800;
    }

    .promo-expiry {
      margin: -10px auto 20px;
      font-size: 12px;
      opacity: 0.55;
    }

    .unlock-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      cursor: pointer;
      padding: 14px 26px;
      border-radius: 13px;
      background: linear-gradient(135deg, #ff3f92, #ff78b8);
      color: white;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(255, 63, 146, 0.25);
      transition: 0.2s ease;
    }

    .unlock-btn:hover {
      transform: translateY(-2px);
    }

    .unlock-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .coin-balance {
      margin-top: 15px;
      font-size: 14px;
      opacity: 0.7;
    }

    .chapter-message {
      margin: 20px auto 0;
      max-width: 520px;
      padding: 13px 16px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .chapter-message.error {
      display: block;
      background: rgba(255, 70, 70, 0.1);
      border: 1px solid rgba(255, 70, 70, 0.18);
      color: #ff9b9b;
    }

    .chapter-message.success {
      display: block;
      background: rgba(60, 220, 140, 0.1);
      border: 1px solid rgba(60, 220, 140, 0.18);
      color: #8ff0b8;
    }

    .chapter-nav {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 25px;
    }

    .chapter-nav a {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.045);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .chapter-nav a:hover {
      background: rgba(255,105,180,0.1);
    }

    .chapter-nav .next {
      text-align: right;
    }

    .chapter-nav a.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .nav-label {
      display: block;
      font-size: 12px;
      opacity: 0.55;
      margin-bottom: 4px;
    }

    .nav-title {
      display: block;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chapter-footer {
      text-align: center;
      margin-top: 35px;
      opacity: 0.5;
      font-size: 13px;
    }

    .loading-state,
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      opacity: 0.7;
    }

    .error-state {
      text-align: center;
      padding: 50px 20px;
      border-radius: 18px;
      background: rgba(255,70,70,0.08);
      border: 1px solid rgba(255,70,70,0.18);
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .chapter-wrap {
        width: min(100% - 20px, 900px);
        padding-top: 15px;
      }

      .chapter-content {
        padding: 24px 19px;
        font-size: 17px;
        line-height: 1.9;
      }

      .chapter-top {
        margin-bottom: 15px;
      }

      .chapter-heading {
        margin-bottom: 25px;
      }

      .chapter-nav {
        flex-direction: column;
      }

      .chapter-nav .next {
        text-align: left;
      }
    }
  </style>
</head>

<body class="reader-page chapter-page">

<main class="chapter-wrap">

  <div class="chapter-top">

    <a href="#" id="backToBook" class="back-btn">
      ← Back to Book
    </a>

    <a href="coins.html" class="coin-btn">
      🪙 <span id="topCoins">0</span> Coins
    </a>

  </div>

  <div id="loadingState" class="loading-state">
    Loading chapter...
  </div>

  <div id="chapterArea" style="display:none;">

    <header class="chapter-heading">

      <div id="bookTitle" class="chapter-book"></div>

      <h1 id="chapterTitle"></h1>

      <p id="chapterMeta"></p>

      <div id="chapterStatus" class="chapter-status"></div>

    </header>

    <section class="chapter-card">

      <div id="lockScreen" class="chapter-lock" style="display:none;">

        <div class="lock-icon">🔒</div>

        <h2>This Chapter Is Locked</h2>

        <p>
          Unlock this chapter with coins to continue reading.
        </p>

        <div id="promotionBadge"
             class="promo-badge"
             style="display:none;">
          🔥 Limited-Time Offer
        </div>

        <div class="unlock-price" id="unlockPriceBox">
          🪙 <span id="unlockPrice">5</span> Coins
        </div>

        <div id="promotionExpiry"
             class="promo-expiry"
             style="display:none;">
        </div>

        <br>

        <button id="unlockButton"
                class="unlock-btn"
                type="button">
          🔓 Unlock Chapter
        </button>

        <div id="coinBalance" class="coin-balance">
          You have 0 coins
        </div>

        <div id="unlockMessage"
             class="chapter-message">
        </div>

      </div>

      <article id="chapterContent"
               class="chapter-content"
               style="display:none;">
      </article>

    </section>

    <div id="chapterNavigation"
         class="chapter-nav">
    </div>

    <div class="chapter-footer">
      You're reading on Novelora · Your next story awaits.
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
"use strict";

const params = new URLSearchParams(window.location.search);

let chapterId = params.get("id");
const bookId = params.get("bookId");

let currentBook = null;
let currentChapter = null;
let currentUser = null;
let chapters = [];
let currentChapterIndex = -1;
let currentCoinBalance = 0;

const loadingState = document.getElementById("loadingState");
const chapterArea = document.getElementById("chapterArea");
const bookTitleEl = document.getElementById("bookTitle");
const chapterTitleEl = document.getElementById("chapterTitle");
const chapterMetaEl = document.getElementById("chapterMeta");
const chapterStatusEl = document.getElementById("chapterStatus");
const chapterContent = document.getElementById("chapterContent");
const lockScreen = document.getElementById("lockScreen");
const unlockPriceEl = document.getElementById("unlockPrice");
const unlockButton = document.getElementById("unlockButton");
const coinBalanceEl = document.getElementById("coinBalance");
const topCoins = document.getElementById("topCoins");
const unlockMessage = document.getElementById("unlockMessage");
const promotionBadge = document.getElementById("promotionBadge");
const promotionExpiry = document.getElementById("promotionExpiry");
const backToBook = document.getElementById("backToBook");
const chapterNavigation = document.getElementById("chapterNavigation");

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDate(value) {
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "";

  return date.toLocaleDateString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

function getChapterNumber(chapter) {
  return Number(
    chapter.chapter_number ??
    chapter.chapterNumber ??
    chapter.number ??
    chapter.chapter ??
    0
  );
}

function getChapterPrice(chapter) {
  const possible = [
    chapter.coin_price,
    chapter.coinPrice,
    chapter.price,
    chapter.chapter_price,
    chapter.chapterPrice,
    chapter.coins
  ];

  for (const value of possible) {
    const number = Number(value);

    if (Number.isFinite(number) && number >= 0) {
      return number;
    }
  }

  return Number(currentBook?.chapter_price) || 5;
}

function isChapterFree(chapter) {
  return (
    chapter.is_free === true ||
    chapter.isFree === true ||
    chapter.free === true ||
    getChapterPrice(chapter) === 0
  );
}

function getChapterContent(chapter) {
  return (
    chapter.content ||
    chapter.chapter_content ||
    chapter.chapterContent ||
    chapter.body ||
    chapter.text ||
    ""
  );
}

function getChapterTitle(chapter) {
  return (
    chapter.title ||
    "Chapter " + getChapterNumber(chapter)
  );
}

async function loadCurrentUser() {
  try {
    const { data } = await supabaseClient.auth.getUser();
    currentUser = data?.user || null;
  } catch (error) {
    console.warn("Auth check failed:", error);
    currentUser = null;
  }
}

async function loadCoinBalance() {
  currentCoinBalance = 0;

  if (!currentUser) {
    updateCoinDisplay();
    return;
  }

  try {
    const { data, error } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

    if (!error && data) {
      if (data.coins !== undefined && data.coins !== null) {
        currentCoinBalance = Number(data.coins) || 0;
        updateCoinDisplay();
        return;
      }

      if (
        data.coin_balance !== undefined &&
        data.coin_balance !== null
      ) {
        currentCoinBalance = Number(data.coin_balance) || 0;
        updateCoinDisplay();
        return;
      }
    }
  } catch (error) {
    console.warn("Could not read profile coins:", error);
  }

  updateCoinDisplay();
}

function updateCoinDisplay() {
  topCoins.textContent = currentCoinBalance;
  coinBalanceEl.textContent =
    "You have " +
    currentCoinBalance +
    " coin" +
    (currentCoinBalance === 1 ? "" : "s");
}

async function loadBook() {
  if (!bookId) {
    showError("No book was selected.");
    return false;
  }

  const { data, error } = await supabaseClient
    .from("books")
    .select("*")
    .eq("id", bookId)
    .single();

  if (error || !data) {
    console.error("Book loading error:", error);
    showError("This book could not be found.");
    return false;
  }

  currentBook = data;

  bookTitleEl.textContent =
    currentBook.title || "Novelora Story";

  document.title =
    (currentBook.title || "Chapter") +
    " | Novelora";

  backToBook.href =
    "book-details.html?id=" +
    encodeURIComponent(bookId);

  return true;
}

async function loadChapterList() {
  let result = await supabaseClient
    .from("chapters")
    .select("*")
    .eq("book_id", bookId)
    .eq("status", "published")
    .order("chapter_number", { ascending: true });

  if (result.error) {
    console.warn(
      "Published chapter query failed, trying fallback:",
      result.error
    );

    result = await supabaseClient
      .from("chapters")
      .select("*")
      .eq("book_id", bookId)
      .order("chapter_number", { ascending: true });
  }

  if (result.error) {
    console.error("Chapter list error:", result.error);
    return false;
  }

  chapters = (result.data || []).filter(chapter => {
    return (
      !chapter.status ||
      String(chapter.status).toLowerCase() === "published"
    );
  });

  chapters.sort((a, b) => {
    return getChapterNumber(a) - getChapterNumber(b);
  });

  return true;
}

function findCurrentChapter() {
  return chapters.findIndex(chapter => {
    return String(chapter.id) === String(chapterId);
  });
}

function getActivePromotion() {
  let promotions = [];

  try {
    promotions =
      JSON.parse(
        localStorage.getItem("noveloraPromotions")
      ) || [];
  } catch {
    promotions = [];
  }

  if (!Array.isArray(promotions)) return null;

  const now = new Date();

  const valid = promotions.filter(promotion => {
    const promotionBook =
      promotion.bookId ||
      promotion.bookID ||
      promotion.book;

    if (String(promotionBook) !== String(bookId)) {
      return false;
    }

    const type =
      String(promotion.type || "").toLowerCase();

    if (!type.includes("discount")) {
      return false;
    }

    const price = Number(promotion.discountCoins);

    if (!Number.isFinite(price) || price < 0) {
      return false;
    }

    const start = promotion.startDate
      ? new Date(promotion.startDate)
      : null;

    const end = promotion.endDate
      ? new Date(promotion.endDate)
      : null;

    if (
      start &&
      !Number.isNaN(start.getTime()) &&
      now < start
    ) {
      return false;
    }

    if (
      end &&
      !Number.isNaN(end.getTime()) &&
      now > end
    ) {
      return false;
    }

    return true;
  });

  if (!valid.length) return null;

  valid.sort((a, b) => {
    return (
      Number(a.discountCoins) -
      Number(b.discountCoins)
    );
  });

  return valid[0];
}

function getEffectivePrice(chapter) {
  const normalPrice = getChapterPrice(chapter);
  const promotion = getActivePromotion();

  if (!promotion) {
    return {
      normalPrice,
      effectivePrice: normalPrice,
      promotion: null
    };
  }

  const promotionalPrice =
    Number(promotion.discountCoins);

  if (
    !Number.isFinite(promotionalPrice) ||
    promotionalPrice < 0 ||
    promotionalPrice >= normalPrice
  ) {
    return {
      normalPrice,
      effectivePrice: normalPrice,
      promotion: null
    };
  }

  return {
    normalPrice,
    effectivePrice: promotionalPrice,
    promotion
  };
}

async function isChapterUnlocked() {
  if (!currentUser) return false;

  const { data, error } = await supabaseClient
    .from("chapter_unlocks")
    .select("*")
    .eq("user_id", currentUser.id)
    .eq("chapter_id", currentChapter.id)
    .maybeSingle();

  if (error) {
    console.warn("Unlock check:", error);
    return false;
  }

  return !!data;
}

async function renderChapter() {
  if (!currentChapter) {
    showError("This chapter could not be found.");
    return;
  }

  const number = getChapterNumber(currentChapter);
  const title = getChapterTitle(currentChapter);
  const free = isChapterFree(currentChapter);
  const pricing = getEffectivePrice(currentChapter);

  chapterTitleEl.textContent = title;

  chapterMetaEl.textContent =
    "Chapter " +
    number +
    " · " +
    (
      free
        ? "Free"
        : pricing.effectivePrice + " Coins"
    );

  chapterStatusEl.textContent =
    free
      ? "🆓 Free Chapter"
      : pricing.promotion
        ? "🔥 " +
          pricing.effectivePrice +
          " Coins · Limited Offer"
        : "🪙 " +
          pricing.normalPrice +
          " Coins";

  document.title =
    title + " | Novelora";

  chapterContent.style.display = "none";
  lockScreen.style.display = "none";

  unlockMessage.className = "chapter-message";
  unlockMessage.textContent = "";

  if (free) {
    showChapterContent();
    return;
  }

  if (!currentUser) {
    showLockScreen(
      pricing,
      "Please log in to unlock this chapter."
    );
    return;
  }

  const unlocked = await isChapterUnlocked();

  if (unlocked) {
    showChapterContent();
    return;
  }

  showLockScreen(pricing);
}

function showChapterContent() {
  const content = getChapterContent(currentChapter);

  if (!content) {
    chapterContent.innerHTML = `
      <div class="empty-state">
        This chapter has no content yet.
      </div>
    `;
  } else {
    chapterContent.innerHTML = content
  .replace(/\r\n/g, "\n")
  .replace(/\r/g, "\n")
  .split(/\n{2,}/)
  .map(paragraph => {
    const clean = paragraph.trim();

    if (!clean) return "";

    return `<p>${escapeHTML(clean).replace(/\n/g, "<br>")}</p>`;
  })
  .join("");
  }

  chapterContent.style.display = "block";
  lockScreen.style.display = "none";
}

function showLockScreen(pricing, message) {
  chapterContent.style.display = "none";
  lockScreen.style.display = "block";

  if (pricing.promotion) {
    unlockPriceEl.innerHTML = `
      <span class="promo-old-price">
        ${pricing.normalPrice}
      </span>

      <span class="promo-price">
        ${pricing.effectivePrice}
      </span>
    `;

    promotionBadge.style.display = "block";
    promotionExpiry.style.display = "block";

    promotionExpiry.textContent =
      "Offer ends " +
      formatDate(pricing.promotion.endDate);
  } else {
    unlockPriceEl.textContent =
      pricing.effectivePrice;

    promotionBadge.style.display = "none";
    promotionExpiry.style.display = "none";
  }

  updateCoinDisplay();

  if (!currentUser) {
    unlockButton.disabled = false;
    unlockButton.textContent = "🔐 Log In to Unlock";

    unlockButton.onclick = function() {
      window.location.href = "login.html";
    };
  } else {
    unlockButton.disabled = false;
    unlockButton.textContent = "🔓 Unlock Chapter";
    unlockButton.onclick = unlockChapter;
  }

  if (message) {
    showUnlockMessage(message, "error");
  }
}

async function unlockChapter() {
  if (!currentUser) {
    window.location.href = "login.html";
    return;
  }

  const pricing =
    getEffectivePrice(currentChapter);

  const price =
    Number(pricing.effectivePrice);

  if (currentCoinBalance < price) {
    showUnlockMessage(
      "You don't have enough coins. Please get more coins to continue reading.",
      "error"
    );
    return;
  }

  unlockButton.disabled = true;
  unlockButton.textContent = "Unlocking...";

  const alreadyUnlocked =
    await isChapterUnlocked();

  if (alreadyUnlocked) {
    showChapterContent();
    return;
  }

  /*
   * We intentionally do not fake a successful
   * purchase. The profile must have a real
   * coin balance field before coins are deducted.
   */

  let balanceColumn = null;

  try {
    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (!error && data) {
      if (
        data.coins !== undefined &&
        data.coins !== null
      ) {
        balanceColumn = "coins";
      } else if (
        data.coin_balance !== undefined &&
        data.coin_balance !== null
      ) {
        balanceColumn = "coin_balance";
      }
    }
  } catch (error) {
    console.warn(
      "Could not inspect coin balance:",
      error
    );
  }

  if (!balanceColumn) {
    unlockButton.disabled = false;
    unlockButton.textContent = "🔓 Unlock Chapter";

    showUnlockMessage(
      "Your Novelora coin balance is not connected to the reader profile yet.",
      "error"
    );

    return;
  }

  const newBalance =
    Math.max(
      0,
      currentCoinBalance - price
    );

  const updateData = {};
  updateData[balanceColumn] = newBalance;

  const {
    error: balanceError
  } = await supabaseClient
    .from("profiles")
    .update(updateData)
    .eq("id", currentUser.id);

  if (balanceError) {
    console.error(
      "Coin deduction error:",
      balanceError
    );

    unlockButton.disabled = false;
    unlockButton.textContent = "🔓 Unlock Chapter";

    showUnlockMessage(
      "The coins could not be deducted. Nothing was charged.",
      "error"
    );

    return;
  }

  const {
    error: unlockError
  } = await supabaseClient
    .from("chapter_unlocks")
    .insert({
      user_id: currentUser.id,
      chapter_id: currentChapter.id,
      book_id: bookId,
      coins_spent: price
    });

  if (unlockError) {
    console.error(
      "Unlock record error:",
      unlockError
    );

    /*
     * Restore the coins if the unlock record
     * could not be created.
     */

    const restoreData = {};
    restoreData[balanceColumn] =
      currentCoinBalance;

    await supabaseClient
      .from("profiles")
      .update(restoreData)
      .eq("id", currentUser.id);

    unlockButton.disabled = false;
    unlockButton.textContent = "🔓 Unlock Chapter";

    showUnlockMessage(
      "The chapter could not be unlocked. Your coins were restored.",
      "error"
    );

    return;
  }

  currentCoinBalance = newBalance;
  updateCoinDisplay();

  /*
   * Record the transaction if the current
   * transaction table accepts these fields.
   */

  try {
    await supabaseClient
      .from("coin_transactions")
      .insert({
        user_id: currentUser.id,
        amount: -price,
        type: "chapter_unlock",
        description:
          "Unlocked Chapter " +
          getChapterNumber(currentChapter),
        chapter_id: currentChapter.id,
        book_id: bookId
      });
  } catch (error) {
    console.warn(
      "Transaction record was not created:",
      error
    );
  }

  showUnlockMessage(
    "Chapter unlocked successfully! 💗",
    "success"
  );

  setTimeout(() => {
    showChapterContent();
    unlockButton.disabled = false;
    unlockButton.textContent = "✓ Unlocked";
  }, 500);
}

function showUnlockMessage(message, type) {
  unlockMessage.textContent = message;
  unlockMessage.className =
    "chapter-message " + type;
}

function buildChapterURL(id) {
  return (
    "chapter.html?id=" +
    encodeURIComponent(id) +
    "&bookId=" +
    encodeURIComponent(bookId)
  );
}

function renderNavigation() {
  chapterNavigation.innerHTML = "";

  if (currentChapterIndex < 0) return;

  const previous =
    chapters[currentChapterIndex - 1];

  const next =
    chapters[currentChapterIndex + 1];

  const previousLink =
    document.createElement("a");

  if (previous) {
    previousLink.href =
      buildChapterURL(previous.id);

    previousLink.innerHTML = `
      <span class="nav-label">
        ← Previous Chapter
      </span>

      <span class="nav-title">
        ${escapeHTML(
          getChapterTitle(previous)
        )}
      </span>
    `;

    previousLink.addEventListener(
      "click",
      event => {
        event.preventDefault();
        switchToChapter(previous.id);
      }
    );
  } else {
    previousLink.className = "disabled";

    previousLink.innerHTML = `
      <span class="nav-label">
        ← Previous Chapter
      </span>

      <span class="nav-title">
        Beginning of story
      </span>
    `;
  }

  const nextLink =
    document.createElement("a");

  nextLink.className = "next";

  if (next) {
    nextLink.href =
      buildChapterURL(next.id);

    nextLink.innerHTML = `
      <span class="nav-label">
        Next Chapter →
      </span>

      <span class="nav-title">
        ${escapeHTML(
          getChapterTitle(next)
        )}
      </span>
    `;

    nextLink.addEventListener(
      "click",
      event => {
        event.preventDefault();
        switchToChapter(next.id);
      }
    );
  } else {
    nextLink.className =
      "next disabled";

    nextLink.innerHTML = `
      <span class="nav-label">
        Next Chapter →
      </span>

      <span class="nav-title">
        End of story
      </span>
    `;
  }

  chapterNavigation.appendChild(previousLink);
  chapterNavigation.appendChild(nextLink);
}

async function switchToChapter(nextChapterId) {
  if (!nextChapterId) return;

  const newURL =
    buildChapterURL(nextChapterId);

  window.history.pushState(
    {
      chapterId: nextChapterId
    },
    "",
    newURL
  );

  chapterId = nextChapterId;

  currentChapterIndex =
    findCurrentChapter();

  currentChapter =
    chapters[currentChapterIndex];

  if (!currentChapter) {
    showError(
      "This chapter could not be found."
    );
    return;
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  await renderChapter();
  renderNavigation();
}

window.addEventListener(
  "popstate",
  async () => {
    const newParams =
      new URLSearchParams(
        window.location.search
      );

    chapterId =
      newParams.get("id");

    currentChapterIndex =
      findCurrentChapter();

    currentChapter =
      chapters[currentChapterIndex];

    if (currentChapter) {
      await renderChapter();
      renderNavigation();
    } else {
      showError(
        "This chapter could not be found."
      );
    }
  }
);

function showError(message) {
  loadingState.style.display = "none";
  chapterArea.style.display = "block";

  chapterArea.innerHTML = `
    <div class="error-state">

      <h2>
        Chapter unavailable
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>

      <br>

      <a
        href="reader-dashboard.html"
        class="back-btn"
      >
        ← Back to Dashboard
      </a>

    </div>
  `;
}

async function initialize() {
  try {
    if (!chapterId) {
      showError("No chapter was selected.");
      return;
    }

    if (!bookId) {
      showError("No book was selected.");
      return;
    }

    await loadCurrentUser();

    const bookLoaded =
      await loadBook();

    if (!bookLoaded) return;

    const chaptersLoaded =
      await loadChapterList();

    if (!chaptersLoaded) {
      showError(
        "Could not load the chapters for this book."
      );
      return;
    }

    currentChapterIndex =
      findCurrentChapter();

    if (currentChapterIndex === -1) {
      showError(
        "This chapter does not exist or is not published."
      );
      return;
    }

    currentChapter =
      chapters[currentChapterIndex];

    await loadCoinBalance();

    await renderChapter();

    renderNavigation();

    chapterArea.style.display = "block";
    loadingState.style.display = "none";

  } catch (error) {
    console.error(
      "Chapter initialization error:",
      error
    );

    showError(
      "Something went wrong while loading this chapter."
    );
  }
}

initialize();
</script>
